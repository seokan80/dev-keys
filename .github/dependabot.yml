# 계획서 9장: 월 1회 의존성 업데이트
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 은 typescript-eslint · @astrojs/check 가 지원할 때까지 보류 (AGENTS.md 환경)
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # 실행 환경이 Node 24(.nvmrc)라 타입도 24.x 에 맞춘다
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
