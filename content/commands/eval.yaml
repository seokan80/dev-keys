# 명령 찾기 평가 세트 (구현계획 5.9 ②) — 사람이 검색창에 칠 법한 상황 질문과 정답 명령 주소(/git/commands/<주소>).
# 세트의 상황 문장을 베끼지 않고 쓴다. 정답이 여럿일 수 있으면 모두 적는다. npm run eval:commands 로 정답률을 잰다.
# 세트가 바뀌어 명령 주소가 없어지면 validate:content 가 알려 준다.

# ── 1부 로컬
- { q: 새 프로젝트 폴더를 git 저장소로 만들고 싶어, expect: [init] }
- { q: 지금 어떤 파일이 바뀌었는지 보고 싶다, expect: [status, status-short, status-sb, diff-stat] }
- { q: 바뀐 파일을 짧게 한 줄씩, expect: [status-short, status-sb] }
- { q: 고친 파일을 커밋할 목록에 올리기, expect: [add] }
- { q: 파일에서 일부 줄만 골라서 스테이징, expect: [add-p] }
- { q: 스테이징한 파일 다시 빼기, expect: [restore-staged, restore-staged-p] }
- { q: 고친 내용 버리고 원래대로, expect: [restore, restore-p] }
- { q: 커밋하기 전에 뭐가 들어가는지 확인, expect: [diff-staged, diff-staged-stat, commit-v] }
- { q: 메시지 적어서 커밋하기, expect: [commit-m, commit-am] }
- { q: 방금 커밋에 파일 하나 빠뜨렸어, expect: [commit-amend-no-edit] }
- { q: 마지막 커밋 메시지 오타 수정, expect: [commit-amend-m] }
- { q: 마지막 커밋 취소하고 변경은 남겨 두기, expect: [reset-soft, reset] }
- { q: 커밋 기록을 한 줄씩 짧게, expect: [log-oneline, log-oneline-n] }
- {
    q: 브랜치가 갈라지고 합쳐진 모양을 그래프로,
    expect: [log-all-graph-oneline, log-graph-oneline, log-all-graph-oneline-n, log-graph-oneline-n],
  }
- { q: 특정 커밋에서 뭐가 바뀌었는지, expect: [show, show-stat] }
- { q: 이 코드 줄 누가 언제 고쳤어, expect: [blame-L, blame-date-L] }
- { q: 코드에 어떤 단어가 처음 들어간 커밋, expect: [log-S, log-oneline-S] }
- { q: 특정 사람이 한 커밋만 보기, expect: [log-author, log-author-oneline] }
- { q: 지난주부터 커밋된 것만, expect: [log-since, log-oneline-since] }
- { q: 파일 하나만 예전 커밋 상태로, expect: [restore-source] }
- { q: reset hard 로 날린 커밋 되살리기, expect: [reflog-n] }
- { q: 이미 push 한 커밋 되돌리기, expect: [revert-no-edit] }
- { q: 추적 안 하는 새 파일들 한꺼번에 지우기, expect: [clean-f, clean-fd, clean-n] }
- { q: gitignore 에 넣었는데 이미 커밋된 파일 추적 끊기, expect: [rm-cached] }
- { q: 이 파일이 왜 무시되는지, expect: [check-ignore-v] }
- { q: 새 브랜치 만들고 바로 이동, expect: [switch-c, checkout-b] }
- { q: 다른 브랜치로 이동, expect: [switch] }
- { q: 방금 있던 브랜치로 돌아가기, expect: [switch-dash] }
- { q: 다 합친 브랜치 지우기, expect: [branch-d] }
- { q: 합치지 않은 브랜치 강제로 지우기, expect: [branch-D] }
- { q: 브랜치 이름 바꾸기, expect: [branch-m] }
- { q: 기능 브랜치를 main 에 합치기, expect: [merge, merge-no-ff, merge-ff-only] }
- { q: 하던 작업 잠깐 치워 두기, expect: [stash, stash-push-m-u] }
- { q: 치워 둔 작업 다시 꺼내기, expect: [stash-pop, stash-apply] }
- { q: 잘못된 브랜치에 커밋했어 다른 브랜치로 옮기고 싶다, expect: [cherry-pick, cherry-pick-x] }
- { q: 브랜치 두 개를 다른 폴더에서 동시에 열기, expect: [worktree-add-b] }
- { q: main 이랑 기능 브랜치가 뭐가 다른지, expect: [diff, diff-stat, log-oneline] }

# ── 2부 원격
- { q: github 저장소 주소 연결, expect: [remote-add] }
- { q: 연결된 원격 주소 확인, expect: [remote-v, remote-show] }
- { q: 처음 push 할 때 upstream 설정, expect: [push-u] }
- { q: 새 브랜치를 push 했는데 upstream 이 없대, expect: [push-u, config-push-autoSetupRemote] }
- { q: 원격 저장소 내려받기, expect: [clone] }
- { q: 동료가 올린 거 받아만 오고 합치진 않기, expect: [fetch] }
- { q: 원격 변경 받아서 합치기, expect: [pull, pull-rebase] }
- { q: pull 할 때 머지 커밋 안 생기게, expect: [pull-rebase, config-pull-rebase, pull-ff-only] }
- { q: 원격 브랜치 목록, expect: [branch-r, branch-a, ls-remote-heads] }
- { q: 원격에서 지워진 브랜치 정리, expect: [fetch-prune, config-fetch-prune] }
- { q: 원격 브랜치 삭제, expect: [push-delete] }
- { q: 충돌 나서 merge 그만두고 싶다, expect: [merge-abort] }
- { q: rebase 중 충돌 해결하고 계속, expect: [rebase-continue] }
- { q: rebase 하다가 취소, expect: [rebase-abort] }
- { q: 충돌 표시를 더 보기 쉽게, expect: [config-merge-conflictStyle] }
- { q: 같은 충돌을 매번 다시 풀기 귀찮아, expect: [config-rerere-enabled] }
- { q: 내 브랜치가 원격보다 몇 개 앞서고 뒤처졌는지, expect: [status-sb, branch-vv, log-left-right-oneline] }
- { q: 원격 주소를 ssh 로 바꾸기, expect: [remote-set-url] }
- { q: 서브모듈 추가, expect: [submodule-add] }
- { q: 서브모듈까지 한 번에 clone, expect: [clone-recurse-submodules] }
- { q: 받은 저장소의 서브모듈 폴더가 비어 있어, expect: [submodule-update-init] }

# ── 3부 기록 다듬기
- { q: 지저분한 커밋 여러 개를 하나로 합치기, expect: [rebase-i, rebase-autosquash-i] }
- { q: 예전 커밋에 나중에 고친 걸 합치기, expect: [commit-fixup, commit-fixup-a, rebase-autosquash-i] }
- { q: 이미 push 한 내 브랜치 커밋을 고쳐서 다시 올리기, expect: [push-force-with-lease] }
- { q: 강제 push 하는데 남의 커밋은 안 지우게, expect: [push-force-with-lease, config-push-useForceIfIncludes] }
- { q: rebase 전후로 커밋이 어떻게 달라졌는지 비교, expect: [range-diff] }
- { q: 커밋 작성자 이메일을 잘못 넣었어, expect: [commit-amend-no-edit-reset-author, rebase-exec, config-user-email] }
- { q: 같은 사람이 이메일이 달라서 두 명으로 집계돼, expect: [check-mailmap, shortlog-sne] }
- { q: 누가 커밋을 몇 개 했는지, expect: [shortlog-sn, shortlog-sne] }
- { q: 릴리스 버전 태그 붙이기, expect: [tag-a-m, tag] }
- { q: 태그를 원격에 올리기, expect: [push-follow-tags, push, config-push-followTags] }
- { q: 잘못 만든 태그 지우기, expect: [tag-d] }
- { q: 지금 커밋이 어느 버전 다음인지, expect: [describe] }
- { q: github 릴리스 만들기, expect: [gh-release-create-generate-notes] }
- { q: 쌓아 둔 브랜치들을 함께 rebase, expect: [rebase-autosquash-update-refs, config-rebase-updateRefs] }

# ── 4부 협업과 브랜치 전략
- { q: PR 만들기, expect: [gh-pr-create-fill, gh-pr-create-draft-fill] }
- { q: PR 을 squash 로 합치고 브랜치 지우기, expect: [gh-pr-merge-delete-branch-squash] }
- { q: PR 에서 바뀐 파일 목록, expect: [gh-pr-diff-name-only] }
- { q: 합친 PR 목록 보기, expect: [gh-pr-list-json-limit-state] }
- { q: main 을 stage 랑 똑같이 fast-forward 로만, expect: [merge-ff-only] }
- { q: 이 커밋이 어느 브랜치에 들어가 있는지, expect: [branch-contains] }
- { q: 아직 안 합친 브랜치 찾기, expect: [branch-no-merged] }
- { q: 이미 합친 브랜치 확인, expect: [branch-merged] }
- { q: cherry-pick 으로 올린 것 중 빠진 커밋 찾기, expect: [cherry-v] }
- { q: 수정 커밋을 릴리스 브랜치에 백포트, expect: [cherry-pick-x] }
- { q: dev 브랜치를 main 에서 새로 만들기, expect: [switch-C] }
- { q: fork 한 저장소에 원본 저장소 연결, expect: [remote-add] }
- { q: pull 은 원본에서 push 는 내 fork 로, expect: [config-remote-pushDefault, branch-set-upstream-to] }

# ── 5부 AI 에이전트와 Git
- { q: AI 에이전트 작업용으로 폴더를 하나 더 열기, expect: [worktree-add-b] }
- { q: 다 쓴 작업 폴더 지우기, expect: [worktree-remove, worktree-remove-force] }
- { q: 에이전트가 바꾼 파일 요약 보기, expect: [diff-stat, status-short] }
- { q: 스테이징한 것만 남기고 테스트하기, expect: [stash-push-keep-index-u, stash-push-keep-index-m-u] }
- { q: 커밋에 AI 공동 작성자 남기기, expect: [commit-trailer-m, config-trailer-ai-key] }
- { q: 커밋 메시지로 커밋 찾기, expect: [log-grep-oneline] }
- { q: 버그가 처음 생긴 커밋 찾기, expect: [bisect-start, bisect-run, bisect-bad, bisect-good] }
- { q: 테스트 스크립트로 버그 커밋 자동으로 찾기, expect: [bisect-run] }
- { q: 큰 저장소 최근 것만 빨리 받기, expect: [clone-depth, clone-filter] }
- { q: 필요한 폴더만 꺼내 두기, expect: [sparse-checkout-set] }
- { q: draft PR 을 리뷰 받을 수 있게, expect: [gh-pr-ready] }
- { q: 커밋에 서명하기, expect: [config-commit-gpgSign, config-gpg-format, config-user-signingkey] }

# ── 설정
- { q: git 사용자 이름 설정, expect: [config-user-name] }
- { q: 기본 브랜치 이름을 main 으로, expect: [config-init-defaultBranch] }
- { q: 설정이 어느 파일에서 왔는지, expect: [config-list-show-origin] }
- { q: 자주 쓰는 명령 별칭 만들기, expect: [config-alias-lg] }
- { q: 고치던 파일이 있어도 pull rebase 되게, expect: [config-rebase-autoStash] }

# ── 사람이 쓴 질문 (명령 찾기에서 놓친 것을 보고받아 더한다 — 상황 문장보다 먼저 여기에)
- { q: 커밋 아이디로 변경 파일 목록 조회, expect: [show-name-only, show-stat] }
