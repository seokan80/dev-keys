# 명령 찾기 상황 문장 — 4부 협업과 브랜치 전략 (구현계획 5.9 ③). 평가 세트의 질문을 베끼지 않는다.

gh-pr-create-fill:
  - 풀 리퀘스트 열기
  - 터미널에서 PR 생성
  - gh 로 PR 만들기

gh-pr-merge-delete-branch-squash:
  - PR 머지하기
  - squash merge
  - PR 합치고 브랜치 정리

gh-pr-list-json-limit-state:
  - PR 목록 보기
  - 머지된 PR 찾기

gh-pr-view-json:
  - PR 정보 보기
  - PR 상태 확인

gh-pr-view-jq-json:
  - PR 에 든 커밋 목록

merge-ff-only:
  - fast forward 로만 합치기
  - 갈라졌으면 합치지 않기
  - 운영 배포 브랜치 올리기

push-follow-tags:
  - 태그랑 커밋 같이 push
  - 태그 올리기

branch-contains:
  - 커밋이 포함된 브랜치
  - 이 기능 어디까지 배포됐지

branch-set-upstream-to:
  - upstream 바꾸기
  - 추적 브랜치 변경
  - 브랜치 짝 다시 정하기

cherry-v:
  - 아직 안 올라간 커밋 찾기
  - cherry-pick 빠진 거 확인
  - 같은 변경이 들어갔는지 확인

config-remote-pushDefault:
  - 기본 push 원격 정하기
  - fork 로만 push

rebase:
  - 브랜치를 최신 위로 옮기기
  - main 최신에 맞춰 rebase
  - PR 브랜치 최신으로

switch-C:
  - 브랜치 다시 만들기
  - 브랜치를 다른 커밋으로 덮어쓰기

log-n:
  - 마지막 커밋 하나 자세히
