id: shell-paths
category: shell
title: 현재 위치와 경로 익히기
description: 서비스 폴더를 돌아다니며 pwd · ls · cd와 상대 경로, 경로를 정리하는 도구를 익힌다
order: 1
level: 1
items:
  - id: step-1
    type: copy
    text: pwd
    note: 현재 디렉터리의 절대 경로를 확인한다. 옆 트리의 현재 위치와 함께 본다
    output: ~/workspace
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/src/
        - project/src/app.js
      caption: 조회 명령은 파일과 현재 위치를 바꾸지 않는다
  - id: step-2
    type: copy
    text: ls -1
    note: 항목을 한 줄에 하나씩 확인한다. 경로를 주면 이동하지 않고도 볼 수 있다
    output: project
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/src/
        - project/src/app.js
      caption: 조회 명령은 파일과 현재 위치를 바꾸지 않는다
  - id: step-3
    type: copy
    text: cd project
    note: 현재 위치를 기준으로 이동한다. ..는 부모, .은 현재 디렉터리다
    fileState:
      cwd: project
      entries:
