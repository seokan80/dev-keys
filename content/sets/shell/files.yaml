  - id: parents
    prompt: 없는 부모까지 포함해 project/tmp/cache 디렉터리 만들기
    answers:
      - mkdir -p project/tmp/cache
    type: recall
    note: Bash + GNU 도구 기준. 표시한 답 중 하나를 정확히 입력한다
  - id: copy
    prompt: project/src/app.js 파일을 project/backups/app.js 경로로 복사
