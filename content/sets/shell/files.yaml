id: shell-files
category: shell
title: 파일과 폴더 정리하기
description: 서비스 파일을 백업하고 옮기고 정리하며 mkdir · touch · cp · mv · rm · rmdir를 익힌다
order: 2
level: 1
items:
  - id: step-1
    type: copy
    text: pwd
    note: 현재 디렉터리의 절대 경로를 확인한다. 옆 트리의 현재 위치와 함께 본다
    output: ~/workspace
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/src/
        - project/src/app.js
      caption: 조회 명령은 파일과 현재 위치를 바꾸지 않는다
  - id: step-2
    type: copy
    text: mkdir -p project/tmp project/backups
    note: 필요한 디렉터리를 만든다. 이미 있으면 그대로 두고 없는 부모도 함께 만든다
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/backups/
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/src/
        - project/src/app.js
        - project/tmp/
      caption: 명령 뒤의 파일 상태다. 새로 생긴 항목은 초록색으로 표시한다
  - id: step-3
    type: copy
    text: touch project/tmp/session.txt
    note: 없는 파일이면 빈 파일을 만든다. 이미 있으면 내용 대신 시각을 갱신한다
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/backups/
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/src/
        - project/src/app.js
        - project/tmp/
        - project/tmp/session.txt
      caption: 명령 뒤의 파일 상태다. 새로 생긴 항목은 초록색으로 표시한다
  - id: step-4
    type: copy
    text: ls -1 project/tmp
    note: 항목을 한 줄에 하나씩 확인한다. 경로를 주면 이동하지 않고도 볼 수 있다
    output: session.txt
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/backups/
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/src/
        - project/src/app.js
        - project/tmp/
        - project/tmp/session.txt
      caption: 조회 명령은 파일과 현재 위치를 바꾸지 않는다
  - id: step-5
    type: copy
    text: cp project/src/app.js project/backups/app.js
    note: 앞 경로의 파일을 뒤 경로로 복사한다. 원본은 남는다
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/backups/
        - project/backups/app.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/src/
        - project/src/app.js
        - project/tmp/
        - project/tmp/session.txt
