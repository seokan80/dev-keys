id: shell-read-files
category: shell
order: 3
title: 파일 내용 읽기
description: 서비스 안내와 설정·로그를 cat · less · head · tail로 읽고 필요한 줄과 크기를 확인한다
level: 1
items:
  - id: step-1
    type: copy
    text: pwd
    note: 연습 시작 위치를 확인한다. 이 세트는 준비된 서비스 파일에서 새로 시작한다
    output: ~/workspace
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 조회·변수 명령은 파일 상태를 바꾸지 않는다
  - id: step-2
    type: copy
    text: cat project/README.md
    note: 짧은 README 전체를 읽는다. 빈 줄도 파일의 내용이다
    output: |-
      DevKeys service

      Start the API with node src/app.js.
      Use APP_ENV=staging during review.

      The health endpoint is /health.
      Logs are stored in logs/app.log.
      Check ERROR lines before release.

      Keep config/app.env out of public reports.
      Read the worker log for background jobs.
      Release only after the checks pass.
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 조회·변수 명령은 파일 상태를 바꾸지 않는다
  - id: step-3
    type: copy
    text: less -F -X project/README.md
    note: less -F는 한 화면에 들어오면 끝내고 -X는 터미널 초기화를 생략한다. 긴 파일의 일반 less 조작은 해설에서 본다
    output: |-
      DevKeys service

      Start the API with node src/app.js.
      Use APP_ENV=staging during review.

      The health endpoint is /health.
      Logs are stored in logs/app.log.
      Check ERROR lines before release.

      Keep config/app.env out of public reports.
      Read the worker log for background jobs.
      Release only after the checks pass.
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 조회·변수 명령은 파일 상태를 바꾸지 않는다
  - id: step-4
    type: copy
    text: head -n 4 project/README.md
    note: README 앞 네 줄만 읽는다. 전체 파일을 쏟아 내지 않고 시작 부분을 확인한다
    output: |-
      DevKeys service

      Start the API with node src/app.js.
      Use APP_ENV=staging during review.
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
