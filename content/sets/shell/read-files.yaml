    text: tail -n 4 project/README.md
    note: README 마지막 네 줄에서 릴리스 전 점검 항목을 확인한다
    output: |-

      Keep config/app.env out of public reports.
      Read the worker log for background jobs.
      Release only after the checks pass.
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
