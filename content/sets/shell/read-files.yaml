  - id: step-12
    type: copy
    text: tail -n +4 project/logs/app.log
    note: 4번째 줄부터 끝까지 읽는다. -n 4처럼 마지막 네 줄을 뜻하지 않는다
    output: |-
      ERROR payment timeout
      INFO retry payment
      ERROR database offline
      INFO GET /orders 200
      INFO shutdown
