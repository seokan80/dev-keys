  - id: step-6
    type: copy
    text: head -n 3 project/config/app.env
    note: 설정 파일의 첫 세 줄에서 환경·포트·로그 수준을 확인한다
    output: |-
      APP_ENV=staging
      PORT=3000
      LOG_LEVEL=info
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
