id: shell-grep-logs
category: shell
order: 4
title: grep으로 로그 찾기
description: 오류·경고 로그를 줄 번호·문맥·고정 문자열로 찾고 일치 없음과 오류를 구분한다
level: 2
items:
  - id: step-1
    type: copy
    text: pwd
    note: 서비스 로그를 검색하기 전에 현재 위치를 확인한다
    output: ~/workspace
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 조회·변수 명령은 파일 상태를 바꾸지 않는다
  - id: step-2
    type: copy
    text: grep "ERROR" project/logs/app.log
    note: ERROR가 들어 있는 줄을 찾는다. 기본 검색은 대소문자를 구분한다
    output: |-
      ERROR payment timeout
      ERROR database offline
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 조회·변수 명령은 파일 상태를 바꾸지 않는다
  - id: step-3
    type: copy
    text: grep -n "ERROR" project/logs/app.log
    note: -n은 일치한 줄 앞에 줄 번호를 붙인다
    output: |-
      4:ERROR payment timeout
      6:ERROR database offline
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 조회·변수 명령은 파일 상태를 바꾸지 않는다
  - id: step-4
    type: copy
    text: grep -i "error" project/logs/app.log
    note: -i는 대소문자를 구분하지 않는다. 소문자 error로 대문자 ERROR도 찾는다
    output: |-
      ERROR payment timeout
      ERROR database offline
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 조회·변수 명령은 파일 상태를 바꾸지 않는다
  - id: step-5
    type: copy
    text: grep -v "INFO" project/logs/app.log
    note: -v는 일치하지 않는 줄을 출력한다. INFO를 제외하고 경고와 오류를 읽는다
    output: |-
      WARN queue delayed
      ERROR payment timeout
      ERROR database offline
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 조회·변수 명령은 파일 상태를 바꾸지 않는다
  - id: step-6
    type: copy
    text: grep -c "ERROR" project/logs/app.log
    note: -c는 일치한 줄 수를 출력한다. 같은 줄에 여러 번 나와도 그 줄은 한 번 센다
    output: '2'
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 조회·변수 명령은 파일 상태를 바꾸지 않는다
  - id: step-7
    type: copy
    text: grep -F "/health" project/logs/app.log
    note: -F는 패턴을 정규식 대신 고정 문자열로 찾는다
    output: INFO GET /health 200
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 조회·변수 명령은 파일 상태를 바꾸지 않는다
  - id: step-8
    type: copy
    text: grep -E "WARN|ERROR" project/logs/app.log
    note: -E는 확장 정규식이다. |로 WARN 또는 ERROR를 찾는다
    output: |-
      WARN queue delayed
      ERROR payment timeout
      ERROR database offline
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 조회·변수 명령은 파일 상태를 바꾸지 않는다
  - id: step-9
    type: copy
    text: grep "^INFO" project/logs/app.log
    note: ^는 줄의 시작이다. INFO로 시작하는 줄만 찾는다
    output: |-
      INFO boot
      INFO GET /health 200
      INFO retry payment
      INFO GET /orders 200
      INFO shutdown
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 조회·변수 명령은 파일 상태를 바꾸지 않는다
  - id: step-10
    type: copy
    text: grep "200$" project/logs/app.log
    note: $는 줄의 끝이다. 200으로 끝나는 줄만 찾는다
    output: |-
      INFO GET /health 200
      INFO GET /orders 200
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 조회·변수 명령은 파일 상태를 바꾸지 않는다
  - id: step-11
    type: copy
    text: grep -n -A 1 "payment timeout" project/logs/app.log
    note: -A 1은 일치한 줄 다음 한 줄을 함께 보여 준다
    output: |-
      4:ERROR payment timeout
      5-INFO retry payment
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 조회·변수 명령은 파일 상태를 바꾸지 않는다
  - id: step-12
    type: copy
    text: grep -n -B 1 "database offline" project/logs/app.log
    note: -B 1은 일치한 줄 앞 한 줄을 함께 보여 준다
    output: |-
      5-INFO retry payment
      6:ERROR database offline
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 조회·변수 명령은 파일 상태를 바꾸지 않는다
  - id: step-13
    type: copy
    text: grep -n -C 1 "database offline" project/logs/app.log
    note: -C 1은 일치한 줄 앞뒤 한 줄을 함께 보여 준다
    output: |-
      5-INFO retry payment
      6:ERROR database offline
      7-INFO GET /orders 200
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 조회·변수 명령은 파일 상태를 바꾸지 않는다
  - id: step-14
    type: copy
    text: grep -l "ERROR" project/logs/app.log project/logs/worker.log
    note: -l은 일치한 파일 이름만 출력한다. 명시한 파일 순서대로 나온다
    output: |-
      project/logs/app.log
      project/logs/worker.log
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 조회·변수 명령은 파일 상태를 바꾸지 않는다
  - id: step-15
    type: copy
    text: grep -L "database" project/logs/app.log project/logs/worker.log
    note: -L은 일치하는 줄이 없는 파일 이름만 출력한다. 소문자 -l과 반대다
    output: project/logs/worker.log
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 조회·변수 명령은 파일 상태를 바꾸지 않는다
  - id: step-16
    type: copy
    text: grep -q "ERROR" project/logs/app.log
    note: -q는 출력 없이 일치 여부만 종료 상태로 알린다. 찾았으므로 0이다
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 조회·변수 명령은 파일 상태를 바꾸지 않는다
  - id: step-17
    type: copy
    text: grep -q "FATAL" project/logs/app.log
    note: FATAL 줄은 없다. 출력은 없고 종료 상태는 1이다. 파일 읽기 오류와 구분한다
    exitCode: 1
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 종료 상태 1 — 줄 위 설명과 출력으로 의미를 확인한다
  - id: step-18
    type: copy
    text: grep -q "ERROR" project/logs/missing.log
    note: 없는 로그를 읽으면 -q여도 오류 메시지가 나오고 종료 상태는 2다. 앞의 일치 없음 1과 구분한다
    output: 'grep: project/logs/missing.log: No such file or directory'
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 종료 상태 2 — 파일을 읽지 못한 오류다. 일치 없음 1과 구분한다
    exitCode: 2
  - id: step-19
    type: copy
    text: grep -rn "ERROR" project/logs | sort
    note: -r은 하위 파일도 검색한다. 탐색 순서에 의존하지 않도록 sort로 정렬했다
    output: |-
      project/logs/app.log:4:ERROR payment timeout
      project/logs/app.log:6:ERROR database offline
      project/logs/worker.log:3:ERROR job failed
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 조회·변수 명령은 파일 상태를 바꾸지 않는다
  - id: number
    type: recall
    prompt: project/logs/app.log에서 ERROR 줄을 줄 번호와 함께 찾기
    answers:
      - grep -n "ERROR" project/logs/app.log
      - grep -n 'ERROR' project/logs/app.log
    note: Bash + GNU 도구 기준. 따옴표·연산자를 포함해 표시한 정답 중 하나를 정확히 입력한다
  - id: ignore-case
    type: recall
    prompt: project/logs/app.log에서 error를 대소문자 구분 없이 찾기
    answers:
      - grep -i "error" project/logs/app.log
    note: Bash + GNU 도구 기준. 따옴표·연산자를 포함해 표시한 정답 중 하나를 정확히 입력한다
  - id: fixed
    type: recall
    prompt: project/logs/app.log에서 /health를 고정 문자열로 찾기
    answers:
      - grep -F "/health" project/logs/app.log
    note: Bash + GNU 도구 기준. 따옴표·연산자를 포함해 표시한 정답 중 하나를 정확히 입력한다
  - id: context
    type: recall
    prompt: project/logs/app.log에서 database offline 줄과 앞뒤 한 줄씩 보기
    answers:
      - grep -n -C 1 "database offline" project/logs/app.log
    note: Bash + GNU 도구 기준. 따옴표·연산자를 포함해 표시한 정답 중 하나를 정확히 입력한다
  - id: quiet
    type: recall
    prompt: project/logs/app.log에 ERROR가 있는지 출력 없이 종료 상태로만 확인
    answers:
      - grep -q "ERROR" project/logs/app.log
    note: Bash + GNU 도구 기준. 따옴표·연산자를 포함해 표시한 정답 중 하나를 정확히 입력한다
