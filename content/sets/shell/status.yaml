id: shell-status
category: shell
order: 8
title: 종료 상태와 조건 실행
description: grep의 일치 여부와 $? · && · || · pipefail로 릴리스 점검의 실행 조건을 구분한다
level: 3
items:
  - id: step-1
    type: copy
    text: pwd
    note: 릴리스 전에 설정과 오류 로그의 상태를 확인하는 연습이다
    output: ~/workspace
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 명령 아래에서 종료 상태를 확인한다
  - id: step-2
    type: copy
    text: 'false'
    note: false는 출력 없이 종료 상태 1을 돌려준다
    exitCode: 1
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 종료 상태 1 — 줄 위 설명과 출력으로 의미를 확인한다
  - id: step-3
    type: copy
    text: printf "%s\n" "$?"
    note: $?는 바로 전 명령의 종료 상태다. 출력한 printf 자체의 종료 상태는 0이다
    output: '1'
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 명령 아래에서 종료 상태를 확인한다
  - id: step-4
    type: copy
    text: 'true'
    note: true는 출력 없이 종료 상태 0을 돌려준다
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 명령 아래에서 종료 상태를 확인한다
  - id: step-5
    type: copy
    text: printf "%s\n" "$?"
    note: 성공한 true의 종료 상태 0을 읽는다
    output: '0'
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 명령 아래에서 종료 상태를 확인한다
  - id: step-6
    type: copy
    text: grep -q "ERROR" project/logs/app.log
    note: ERROR 줄이 있으므로 grep -q의 종료 상태는 0이다
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 명령 아래에서 종료 상태를 확인한다
  - id: step-7
    type: copy
    text: printf "%s\n" "$?"
    note: grep이 일치한 줄을 찾았는지 숫자로 확인한다
    output: '0'
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 명령 아래에서 종료 상태를 확인한다
  - id: step-8
    type: copy
    text: grep -q "FATAL" project/logs/app.log
    note: FATAL 줄이 없으므로 grep의 종료 상태는 1이다. 2처럼 파일 읽기 오류를 뜻하지 않는다
    exitCode: 1
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 종료 상태 1 — 줄 위 설명과 출력으로 의미를 확인한다
  - id: step-9
    type: copy
    text: printf "%s\n" "$?"
    note: 명령 출력이 없어도 $?로 일치 여부를 읽을 수 있다
    output: '1'
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 명령 아래에서 종료 상태를 확인한다
  - id: step-10
    type: copy
    text: grep -q "ERROR" project/logs/app.log && printf "review logs\n"
    note: '&& 뒤 명령은 앞 명령이 0일 때 실행된다'
    output: review logs
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 명령 아래에서 종료 상태를 확인한다
  - id: step-11
    type: copy
    text: grep -q "FATAL" project/logs/app.log || printf "no fatal\n"
    note: '|| 뒤 명령은 앞 명령이 0이 아닐 때 실행된다'
    output: no fatal
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 명령 아래에서 종료 상태를 확인한다
  - id: step-12
    type: copy
    text: grep -q "FATAL" project/logs/app.log && printf "stop release\n"
    note: 일치하지 않았으므로 && 뒤의 stop release는 실행되지 않는다
    exitCode: 1
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 종료 상태 1 — 줄 위 설명과 출력으로 의미를 확인한다
  - id: step-13
    type: copy
    text: test -f project/config/app.env && printf "config ready\n"
    note: test -f로 일반 파일이 있는지 확인한 뒤 성공할 때만 안내한다
    output: config ready
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 명령 아래에서 종료 상태를 확인한다
  - id: step-14
    type: copy
    text: test -f project/config/missing.env || printf "config missing\n"
    note: 없는 설정 파일을 검사해 실패할 때 안내한다
    output: config missing
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 명령 아래에서 종료 상태를 확인한다
  - id: step-15
    type: copy
    text: if grep -q "ERROR" project/logs/app.log; then printf "hold release\n"; fi
    note: if도 명령의 종료 상태를 조건으로 쓴다. 오류 줄이 있으므로 릴리스를 보류한다
    output: hold release
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 명령 아래에서 종료 상태를 확인한다
  - id: step-16
    type: copy
    text: false | true
    note: 기본 파이프의 종료 상태는 마지막 true의 0이다. 앞의 false가 자동으로 전체 실패를 만들지 않는다
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 명령 아래에서 종료 상태를 확인한다
  - id: step-17
    type: copy
    text: printf "%s\n" "$?"
    note: 직전 파이프의 종료 상태 0을 확인한다
    output: '0'
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 명령 아래에서 종료 상태를 확인한다
  - id: step-18
    type: copy
    text: false | true; printf "%s\n" "${PIPESTATUS[*]}"
    note: PIPESTATUS로 각 명령의 상태를 읽는다. 다른 명령이 덮어쓰기 전에 같은 줄에서 바로 확인한다
    output: 1 0
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 명령 아래에서 종료 상태를 확인한다
  - id: step-19
    type: copy
    text: set -o pipefail
    note: pipefail을 켜서 파이프 중 실패한 명령의 상태도 전체 결과에 반영한다
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 명령 아래에서 종료 상태를 확인한다
  - id: step-20
    type: copy
    text: false | true
    note: 이제 false | true의 전체 종료 상태는 1이다
    exitCode: 1
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 종료 상태 1 — 줄 위 설명과 출력으로 의미를 확인한다
  - id: step-21
    type: copy
    text: printf "%s\n" "$?"
    note: pipefail을 켠 결과를 $?로 확인한다
    output: '1'
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 명령 아래에서 종료 상태를 확인한다
  - id: step-22
    type: copy
    text: set +o pipefail
    note: 다음 작업에 영향을 남기지 않도록 pipefail을 다시 끈다
    fileState:
      cwd: .
      entries:
        - project/
        - project/.gitignore
        - project/README.md
        - project/cache/
        - project/cache/assets/
        - project/cache/assets/bundle.js
        - project/config/
        - project/config/app.env
        - project/logs/
        - project/logs/app.log
        - project/logs/worker.log
        - project/notes/
        - project/notes/release notes.txt
        - project/src/
        - project/src/app.js
        - project/src/worker.js
        - project/tmp/
        - project/tmp/empty.tmp
        - project/tmp/old.tmp
        - project/tmp/session.tmp
      caption: 명령 아래에서 종료 상태를 확인한다
  - id: last
    type: recall
    prompt: 바로 전 명령의 종료 상태를 한 줄로 출력
    answers:
      - printf "%s\n" "$?"
    note: Bash + GNU 도구 기준. 따옴표·연산자를 포함해 표시한 정답 중 하나를 정확히 입력한다
  - id: and
    type: recall
    prompt: app 로그에 ERROR가 있으면 review logs를 출력
    answers:
      - grep -q "ERROR" project/logs/app.log && printf "review logs\n"
    note: Bash + GNU 도구 기준. 따옴표·연산자를 포함해 표시한 정답 중 하나를 정확히 입력한다
  - id: or
    type: recall
    prompt: app 로그에서 FATAL 검색이 0이 아닌 상태이면 no fatal을 출력
    answers:
      - grep -q "FATAL" project/logs/app.log || printf "no fatal\n"
    note: Bash + GNU 도구 기준. 따옴표·연산자를 포함해 표시한 정답 중 하나를 정확히 입력한다
  - id: pipefail
    type: recall
    prompt: 파이프 중 실패한 명령도 전체 종료 상태에 반영하도록 Bash 옵션 켜기
    answers:
      - set -o pipefail
