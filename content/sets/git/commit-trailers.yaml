id: git-commit-trailers
category: git
order: 23
title: 기록에 남기기
description: AI 에이전트와 함께한 커밋을 기록에 남기고 찾기 — Conventional Commits · --trailer "Co-authored-by" · log --grep · shortlog --group · 서명 커밋 설정
level: 2
# 이야기: AI 에이전트와 함께 만든 커밋에는 Conventional Commits 제목과 Co-authored-by 꼬리말을 남기고,
#   나중에 그 기록으로 에이전트와 함께한 커밋을 찾고 센다. 끝으로 커밋 서명(SSH)을 설정해 둔다.
# 출력은 실제 git 2.53 으로 뽑았다: scripts/git-story.sh content/stories/git/commit-trailers.sh
# engine: 커밋 그래프가 옆에 늘 보인다. 꼬리말은 엔진이 몰라서 커밋은 as 로 제목만 엔진에 준다.
engine:
  root: 'c7bba81 docs: add README'
items:
  - id: log
    type: copy
    text: git log --oneline
    note: '제목을 "종류(범위): 무엇을" 으로 쓰는 것이 Conventional Commits — feat 기능, fix 버그, docs 문서'
    before: ['git commit -m "ac7bc6d feat(api): add api client"']
    skipEngine: true
    output: |-
      ac7bc6d (HEAD -> main) feat(api): add api client
      c7bba81 docs: add README
  - id: trailer-key
    type: copy
    text: git config set trailer.ai.key Co-authored-by
    note: '꼬리말 줄임말 — --trailer "ai: …" 라고 쓰면 Co-authored-by 로 펼쳐진다 (이 저장소만)'
    skipEngine: true
  - id: commit-search
    type: copy
    text: 'git commit -m "feat(search): add search box" --trailer "ai: Claude <noreply@anthropic.com>"'
    note: (에이전트가 만든 검색창을 검토해 스테이징했다) 함께 만든 커밋에는 공동 작성자 꼬리말
    as: 'git commit -m "feat(search): add search box"'
    hash: 4db80d4
    output: |-
      [main 4db80d4] feat(search): add search box
       1 file changed, 1 insertion(+)
       create mode 100644 search.html
    tree:
      caption: 에이전트와 함께 만든 커밋 — 메시지 끝에 Co-authored-by 가 붙었다
  - id: body
    type: copy
    text: git log -1 --format=%B
    note: 메시지 전체 — 제목, 빈 줄, 꼬리말. GitHub 는 이 꼬리말로 커밋에 공동 작성자를 함께 보여 준다
    skipEngine: true
    output: |-
      feat(search): add search box

      Co-authored-by: Claude <noreply@anthropic.com>
  - id: commit-fix
    type: copy
    text: 'git commit -m "fix(search): ignore empty query" --trailer "ai: Claude <noreply@anthropic.com>"'
    note: (빈 검색어 버그도 에이전트와 고쳤다)
    as: 'git commit -m "fix(search): ignore empty query"'
    hash: e24888f
    output: |-
      [main e24888f] fix(search): ignore empty query
       1 file changed, 1 insertion(+)
       create mode 100644 search.js
    tree:
      caption: 종류가 fix — 나중에 릴리스 노트에서 "고친 것"으로 모인다
  - id: commit-docs
    type: copy
    text: 'git commit -m "docs: describe search"'
    note: (README 는 직접 고쳤다) 혼자 한 커밋에는 꼬리말이 없다
    hash: e39e2eb
    output: |-
      [main e39e2eb] docs: describe search
       1 file changed, 2 insertions(+)
    tree:
      caption: 사람이 혼자 한 커밋 — 기록만 봐도 누가 함께했는지 구분된다
  - id: grep-ai
    type: copy
    text: 'git log --oneline --grep="Co-authored-by: Claude"'
    note: 에이전트와 함께한 커밋만 — 문제가 생겼을 때 먼저 살펴볼 후보
    skipEngine: true
    output: |-
      e24888f fix(search): ignore empty query
      4db80d4 feat(search): add search box
  - id: grep-feat
    type: copy
    text: git log --oneline --grep="^feat"
    note: 제목 규칙 덕에 기능 추가만 모아 볼 수 있다 — 릴리스 노트를 쓸 때
    skipEngine: true
    output: |-
      4db80d4 feat(search): add search box
      ac7bc6d feat(api): add api client
  - id: shortlog
    type: copy
    text: git shortlog -sn --group=author --group=trailer:co-authored-by
    note: 작성자와 공동 작성자를 함께 센다
    skipEngine: true
    output: |2-
           5  Kim Dev
           2  Claude
  - id: sign-format
    type: copy
    text: git config set --global gpg.format ssh
    note: (커밋 서명 준비) GPG 대신 쓰던 SSH 키로 서명한다
    skipEngine: true
  - id: sign-key
    type: copy
    text: git config set --global user.signingkey ~/.ssh/id_ed25519.pub
    note: 서명에 쓸 키. GitHub 설정의 SSH keys 에 같은 키를 Signing key 로 올리면 커밋에 Verified 가 붙는다
    skipEngine: true
  - id: sign-always
    type: copy
    text: git config set --global commit.gpgSign true
    note: 이제 모든 커밋에 서명한다 — 에이전트가 내 이름으로 만든 커밋과 내가 서명한 커밋이 구분된다
    skipEngine: true

  # ── 도전 모드(뜻 보고 치기)
  - id: recall-trailer
    type: recall
    prompt: 커밋하면서 공동 작성자 꼬리말을 붙인다 — 메시지는 <msg>, 공동 작성자는 <who>
    answers:
      - 'git commit -m "<msg>" --trailer "Co-authored-by: <who>"'
      - 'git commit --trailer "Co-authored-by: <who>" -m "<msg>"'
    placeholder: { msg: 'feat(search): add search box', who: 'Claude <noreply@anthropic.com>' }
  - id: recall-trailer-key
    type: recall
    prompt: 꼬리말 줄임말이 Co-authored-by 로 펼쳐지게 한다 — 줄임말은 <token> (이 저장소만)
    answers: [git config set trailer.<token>.key Co-authored-by, git config trailer.<token>.key Co-authored-by]
    placeholder: { token: ai }
  - id: recall-body
    type: recall
    prompt: 마지막 커밋의 메시지 전체(본문 · 꼬리말 포함)를 본다
    answers: [git log -1 --format=%B, git log -1 --pretty=%B, git log -1 --format="%B", git show -s --format=%B]
  - id: recall-grep-ai
    type: recall
    prompt: '메시지에 "Co-authored-by: Claude" 가 들어간 커밋만 한 줄씩 본다'
    answers:
      - 'git log --oneline --grep="Co-authored-by: Claude"'
      - 'git log --grep="Co-authored-by: Claude" --oneline'
  - id: recall-grep-feat
    type: recall
    prompt: 제목이 feat 로 시작하는 커밋만 한 줄씩 본다
    answers: [git log --oneline --grep="^feat", git log --grep="^feat" --oneline, git log --oneline --grep=^feat]
  - id: recall-shortlog
    type: recall
    prompt: 작성자와 공동 작성자를 함께 세어 많은 순으로 본다
    answers:
      - git shortlog -sn --group=author --group=trailer:co-authored-by
      - git shortlog -ns --group=author --group=trailer:co-authored-by
  - id: recall-sign-format
    type: recall
    prompt: 커밋 서명에 SSH 키를 쓰게 한다 (이 PC 전체)
    answers: [git config set --global gpg.format ssh, git config --global gpg.format ssh]
  - id: recall-sign-always
    type: recall
    prompt: 모든 커밋에 서명하게 한다 (이 PC 전체)
    answers:
      - git config set --global commit.gpgSign true
      - git config set --global commit.gpgsign true
      - git config --global commit.gpgSign true
      - git config --global commit.gpgsign true
