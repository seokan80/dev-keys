id: git-conflict
category: git
order: 9
title: 충돌 해결
description: 올리기가 거절되면 받아서 합치고, 같은 줄을 고쳐 충돌하면 고쳐서 끝내기 — merge 로 한 번, rebase 로 한 번, 그만두기까지
level: 2
# 이야기: 동료 lee 와 같은 줄을 고쳐서 올리기가 거절되고, 합칠 때 충돌이 난다. merge 로 한 번, rebase 로 한 번 풀고,
#   zdiff3 · rerere 를 켜 두고, 마지막에는 rebase 를 그만두고 되돌아가 본다.
# 출력은 실제 git 2.53 으로 뽑았다: scripts/git-story.sh content/stories/git/conflict.sh
# 원격은 연습용 서버 저장소이고, https://github.com/kim/ 주소가 그쪽을 가리키게 했다(insteadOf).
# 원격과 충돌은 커밋 그래프 엔진 범위 밖이라 따라치기와 출력만 둔다.
items:
  - id: push-rejected
    type: copy
    text: git push
    note: (lee 가 README 의 같은 줄을 고쳐 먼저 올렸고, 나도 그 줄을 고쳐 커밋했다) 원격에 내게 없는 커밋이 있어서 거절된다. 받아서 합친 뒤 다시 올린다
    output: |-
      To https://github.com/kim/devkeys.git
       ! [rejected]        main -> main (fetch first)
      error: failed to push some refs to 'https://github.com/kim/devkeys.git'
      hint: Updates were rejected because the remote contains work that you do not
      hint: have locally. This is usually caused by another repository pushing to
      hint: the same ref. If you want to integrate the remote changes, use
      hint: 'git pull' before pushing again.
      hint: See the 'Note about fast-forwards' in 'git push --help' for details.
  - id: pull-merge
    type: copy
    text: git pull --no-rebase
    note: 이번에는 merge 로 합친다. 같은 줄을 서로 다르게 고쳐서 충돌 — 합치기가 멈추고 내가 고르기를 기다린다
    output: |-
      remote: Enumerating objects: 5, done.
      remote: Counting objects: 100% (5/5), done.
      remote: Compressing objects: 100% (3/3), done.
      remote: Total 3 (delta 0), reused 0 (delta 0), pack-reused 0 (from 0)
      Unpacking objects: 100% (3/3), 322 bytes | 1.00 MiB/s, done.
      From https://github.com/kim/devkeys
         4b0ef0d..0ff7a6b  main       -> origin/main
      Auto-merging README.md
      CONFLICT (content): Merge conflict in README.md
      Automatic merge failed; fix conflicts and then commit the result.
  - id: status-unmerged
    type: copy
    text: git status
    note: 충돌한 파일은 Unmerged paths 에 both modified 로 나온다. 그만두려면 git merge --abort
    output: |-
      On branch main
      Your branch and 'origin/main' have diverged,
      and have 1 and 1 different commits each, respectively.
        (use "git pull" if you want to integrate the remote branch with yours)

      You have unmerged paths.
        (fix conflicts and run "git commit")
        (use "git merge --abort" to abort the merge)

      Unmerged paths:
        (use "git add <file>..." to mark resolution)
              both modified:   README.md

      no changes added to commit (use "git add" and/or "git commit -a")
  - id: cat-conflict
    type: copy
    text: cat README.md
    note: 충돌 표시 — <<<<<<< HEAD 아래가 내 것, ======= 아래가 받아 온 것. 표시 줄까지 지우고 남길 내용으로 고친다
    output: |-
      # DevKeys

      <<<<<<< HEAD
      Typing practice for Korean developers
      =======
      Typing practice for developers and AI agents
      >>>>>>> 0ff7a6b07b2ea778d056e176ddc3d7b7cf3c5f3f
  - id: add-resolved
    type: copy
    text: git add README.md
    note: (두 쪽을 합쳐 "Korean developers and AI agents" 로 고친 뒤) add 로 풀었다고 표시한다
  - id: commit-merge
    type: copy
    text: git commit --no-edit
    note: 머지 커밋을 만들어 합치기를 끝낸다. --no-edit 는 기본 메시지를 그대로 쓴다
    output: "[main 8e21cae] Merge branch 'main' of https://github.com/kim/devkeys"
  - id: log-merge
    type: copy
    text: git log --oneline --graph -4
    note: 갈라졌다가 머지 커밋으로 합쳐진 모양
    output: |-
      *   8e21cae (HEAD -> main) Merge branch 'main' of https://github.com/kim/devkeys
      |\
      | * 0ff7a6b (origin/main, origin/HEAD) docs: mention AI agents
      * | cbc3704 docs: say who it is for
      |/
      * 4b0ef0d feat: add login page
  - id: push-merged
    type: copy
    text: git push
    note: 이제 원격의 커밋을 품고 있어서 올라간다
    output: |-
      Enumerating objects: 10, done.
      Counting objects: 100% (10/10), done.
      Delta compression using up to 8 threads
      Compressing objects: 100% (5/5), done.
      Writing objects: 100% (6/6), 739 bytes | 1.00 MiB/s, done.
      Total 6 (delta 0), reused 0 (delta 0), pack-reused 0 (from 0)
      To https://github.com/kim/devkeys.git
         0ff7a6b..8e21cae  main -> main
  - id: zdiff3
    type: copy
    text: git config --global merge.conflictStyle zdiff3
    note: 충돌 표시에 원래 내용(공통 조상)도 보여 준다 — 양쪽이 각각 무엇을 바꿨는지 보인다
  - id: rerere
    type: copy
    text: git config --global rerere.enabled true
    note: 푼 충돌을 기억했다가, 같은 충돌이 다시 나면 같은 방식으로 풀어 준다 (reuse recorded resolution). rebase 를 여러 번 할 때 쓸모 있다
  - id: pull-rebase-conflict
    type: copy
    text: git pull --rebase
    note: (lee 는 버튼을 Sign in 으로, 나는 Log in with GitHub 로 고쳤다) 내 커밋을 옮겨 쌓다가 충돌로 멈췄다. rerere 가 충돌 모양을 적어 두었다(Recorded preimage)
    output: |-
      remote: Enumerating objects: 5, done.
      remote: Counting objects: 100% (5/5), done.
      remote: Compressing objects: 100% (3/3), done.
      remote: Total 3 (delta 0), reused 0 (delta 0), pack-reused 0 (from 0)
      Unpacking objects: 100% (3/3), 303 bytes | 1.00 MiB/s, done.
      From https://github.com/kim/devkeys
         8e21cae..211a0a9  main       -> origin/main
      Auto-merging login.html
      CONFLICT (content): Merge conflict in login.html
      error: could not apply 77cbbd7... feat: log in with GitHub
      hint: Resolve all conflicts manually, mark them as resolved with
      hint: "git add/rm <conflicted_files>", then run "git rebase --continue".
      hint: You can instead skip this commit: run "git rebase --skip".
      hint: To abort and get back to the state before "git rebase", run "git rebase --abort".
      hint: Disable this message with "git config set advice.mergeConflict false"
      Recorded preimage for 'login.html'
      Could not apply 77cbbd7... # feat: log in with GitHub
  - id: diff-unmerged
    type: copy
    text: git diff --name-only --diff-filter=U
    note: 충돌이 남은 파일만 — 파일이 많을 때 무엇을 고쳐야 하는지 본다
    output: login.html
  - id: cat-zdiff3
    type: copy
    text: cat login.html
    note: zdiff3 모양 — ||||||| 아래가 원래 내용. rebase 중에는 HEAD 쪽이 받아 온 커밋, 아래쪽이 옮기던 내 커밋이다 (merge 와 반대)
    output: |-
      <form id="login">
      <<<<<<< HEAD
        <button>Sign in</button>
      ||||||| parent of 77cbbd7 (feat: log in with GitHub)
        <button>Log in</button>
      =======
        <button>Log in with GitHub</button>
      >>>>>>> 77cbbd7 (feat: log in with GitHub)
      </form>
  - id: add-rebase
    type: copy
    text: git add login.html
    note: (둘을 합쳐 "Sign in with GitHub" 로 고친 뒤) 풀었다고 표시한다
  - id: rebase-continue
    type: copy
    text: git rebase --continue
    note: 고친 커밋을 만들고 남은 커밋을 계속 옮긴다. rerere 가 푼 결과를 기억했다(Recorded resolution)
    output: |-
      Recorded resolution for 'login.html'.
      [detached HEAD 71f6997] feat: log in with GitHub
       1 file changed, 1 insertion(+), 1 deletion(-)
      Successfully rebased and updated refs/heads/main.
  - id: log-rebased
    type: copy
    text: git log --oneline -3
    note: 내 커밋이 lee 의 커밋 뒤로 — 머지 커밋 없이 한 줄
    output: |-
      71f6997 (HEAD -> main) feat: log in with GitHub
      211a0a9 (origin/main, origin/HEAD) fix: say sign in
      8e21cae Merge branch 'main' of https://github.com/kim/devkeys
  - id: push-rebased
    type: copy
    text: git push
    note: 올린다
    output: |-
      Enumerating objects: 5, done.
      Counting objects: 100% (5/5), done.
      Delta compression using up to 8 threads
      Compressing objects: 100% (3/3), done.
      Writing objects: 100% (3/3), 347 bytes | 1.00 MiB/s, done.
      Total 3 (delta 0), reused 0 (delta 0), pack-reused 0 (from 0)
      To https://github.com/kim/devkeys.git
         211a0a9..71f6997  main -> main
  - id: pull-rebase-again
    type: copy
    text: git pull --rebase
    note: (lee 는 제목에 (beta) 를 붙였고, 나는 DevKeys 2 로 바꿨다) 또 충돌. 이번에는 lee 와 먼저 이야기해 보기로 한다
    output: |-
      remote: Enumerating objects: 5, done.
      remote: Counting objects: 100% (5/5), done.
      remote: Compressing objects: 100% (3/3), done.
      remote: Total 3 (delta 0), reused 0 (delta 0), pack-reused 0 (from 0)
      Unpacking objects: 100% (3/3), 325 bytes | 1.00 MiB/s, done.
      From https://github.com/kim/devkeys
         71f6997..a7641c6  main       -> origin/main
      Auto-merging README.md
      CONFLICT (content): Merge conflict in README.md
      error: could not apply 6af15a0... docs: rename to DevKeys 2
      hint: Resolve all conflicts manually, mark them as resolved with
      hint: "git add/rm <conflicted_files>", then run "git rebase --continue".
      hint: You can instead skip this commit: run "git rebase --skip".
      hint: To abort and get back to the state before "git rebase", run "git rebase --abort".
      hint: Disable this message with "git config set advice.mergeConflict false"
      Recorded preimage for 'README.md'
      Could not apply 6af15a0... # docs: rename to DevKeys 2
  - id: rebase-abort
    type: copy
    text: git rebase --abort
    note: 풀지 않고 rebase 하기 전으로 돌아간다. merge 하다 멈췄다면 git merge --abort
  - id: status-aborted
    type: copy
    text: git status
    note: pull 하기 전 그대로 — 갈라진 채로 남아 있고, 받아 온 origin/main 은 그대로 있다
    output: |-
      On branch main
      Your branch and 'origin/main' have diverged,
      and have 1 and 1 different commits each, respectively.
        (use "git pull" if you want to integrate the remote branch with yours)

      nothing to commit, working tree clean
  - id: recall-pull-merge
    type: recall
    prompt: 원격의 새 커밋을 받아 merge 로 합친다 — pull 설정과 상관없이
    answers: [git pull --no-rebase]
  - id: recall-add-resolved
    type: recall
    prompt: 충돌을 고친 <file> 파일을 풀었다고 표시한다
    answers: [git add <file>]
    placeholder: { file: README.md }
  - id: recall-merge-abort
    type: recall
    prompt: 충돌로 멈춘 merge 를 그만두고 시작 전으로 돌아간다
    answers: [git merge --abort]
  - id: recall-rebase-continue
    type: recall
    prompt: 충돌을 풀고 표시한 뒤 rebase 를 이어 간다
    answers: [git rebase --continue]
  - id: recall-rebase-abort
    type: recall
    prompt: 충돌로 멈춘 rebase 를 그만두고 시작 전으로 돌아간다
    answers: [git rebase --abort]
  - id: recall-diff-unmerged
    type: recall
    prompt: 충돌이 남은 파일의 이름만 본다
    answers: [git diff --name-only --diff-filter=U]
  - id: recall-zdiff3
    type: recall
    prompt: 충돌 표시에 공통 조상의 내용도 보이게 전역 설정한다
    answers: [git config --global merge.conflictStyle zdiff3, git config set --global merge.conflictStyle zdiff3]
  - id: recall-rerere
    type: recall
    prompt: 한 번 푼 충돌을 기억해 다시 쓰게 전역 설정한다
    answers: [git config --global rerere.enabled true, git config set --global rerere.enabled true]
