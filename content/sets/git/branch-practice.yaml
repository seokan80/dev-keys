id: git-branch-practice
category: git
order: 6
title: 브랜치 실전
description: 브랜치 비교(main..feature · 세 점 diff) · 잘못된 브랜치에 한 커밋을 cherry-pick 으로 옮기기 · worktree · stash 심화
level: 2
# 이야기: ~/devkeys 에서 검색 기능 브랜치(feature/search)를 만들던 중, main 과 무엇이 다른지 비교하고,
#   실수로 main 에 한 커밋을 feature/search 로 옮기고, 급한 수정은 worktree 로 따로 열고, 하던 일은 stash 로 치워 둔다.
# 출력은 실제 git 2.53 으로 뽑았다: scripts/git-story.sh content/stories/git/branch-practice.sh
# engine: 명령을 Git 엔진으로 돌려 tree 가 있는 줄에 커밋 트리 그림을 만든다. 엔진이 모르는 명령은 skipEngine.
engine:
  root: 'c7bba81 docs: add README'
items:
  - id: branch-v
    type: copy
    text: git branch -v
    note: (검색 기능을 feature/search 에서 만드는 중) 브랜치마다 마지막 커밋
    before:
      - 'git commit -m "8f2fbe8 feat: add api client"'
      - git switch -c feature/search
      - 'git commit -m "9ed52dc feat: add search box"'
      - 'git commit -m "efa4d87 feat: query search api"'
      - git switch main
      - 'git commit -m "dd886d7 docs: fix typo in README"'
      - 'git commit -m "9f2fe31 feat: highlight results"'
    skipEngine: true
    output: |2-
        feature/search efa4d87 feat: query search api
      * main           9f2fe31 feat: highlight results
  - id: log-only-feature
    type: copy
    text: git log --oneline main..feature/search
    note: feature/search 에만 있는 커밋 — main 에 합치면 들어갈 것
    skipEngine: true
    output: |-
      efa4d87 (feature/search) feat: query search api
      9ed52dc feat: add search box
  - id: log-only-main
    type: copy
    text: git log --oneline feature/search..main
    note: 거꾸로, main 에만 있는 커밋. 어, 검색 결과 강조(highlight)가 main 에 들어갔다
    skipEngine: true
    output: |-
      9f2fe31 (HEAD -> main) feat: highlight results
      dd886d7 docs: fix typo in README
  - id: diff-three-dot
    type: copy
    text: git diff main...feature/search --stat
    note: 점 세 개 — 갈라진 뒤 feature/search 에서 바뀐 것만. 점 두 개는 두 끝을 그대로 비교한다
    skipEngine: true
    output: |2-
       search.html | 1 +
       search.js   | 1 +
       2 files changed, 2 insertions(+)
  - id: no-merged
    type: copy
    text: git branch --no-merged
    note: 지금 브랜치(main)에 아직 합쳐지지 않은 브랜치 (--merged 의 반대)
    skipEngine: true
    output: '  feature/search'
  - id: switch-feature
    type: copy
    text: git switch feature/search
    note: 잘못 놓인 커밋을 옮기러 간다
    output: Switched to branch 'feature/search'
  - id: cherry-pick
    type: copy
    text: git cherry-pick main
    note: main 이 가리키는 커밋을 복사해 온다. 같은 변경이지만 부모가 달라 해시가 다른 새 커밋
    hash: 5307cb3
    output: |-
      [feature/search 5307cb3] feat: highlight results
       Date: Fri Oct 16 17:00:00 2026 +0900
       1 file changed, 1 insertion(+)
       create mode 100644 highlight.js
    tree:
      caption: main 의 커밋을 feature/search 위로 복사했다 — 원래 커밋은 main 에 그대로
  - id: switch-main
    type: copy
    text: git switch main
    output: Switched to branch 'main'
  - id: reset-main
    type: copy
    text: git reset --hard HEAD~1
    note: main 에서는 빼낸다. 아직 push 하지 않았으니 reset (push 했다면 revert)
    output: 'HEAD is now at dd886d7 docs: fix typo in README'
    tree:
      caption: main 을 한 칸 되돌렸다 — 잘못 놓였던 커밋은 이제 어느 브랜치에도 없다
  - id: graph
    type: copy
    text: git log --oneline --graph --all
    skipEngine: true
    output: |-
      * 5307cb3 (feature/search) feat: highlight results
      * efa4d87 feat: query search api
      * 9ed52dc feat: add search box
      | * dd886d7 (HEAD -> main) docs: fix typo in README
      |/
      * 8f2fbe8 feat: add api client
      * c7bba81 docs: add README
  - id: worktree-add
    type: copy
    text: git worktree add ../devkeys-hotfix -b hotfix/login
    note: (로그인 버그 신고가 들어왔다) 지금 폴더는 그대로 두고, 옆 폴더에 새 브랜치를 하나 더 연다
    skipEngine: true
    output: |-
      Preparing worktree (new branch 'hotfix/login')
      HEAD is now at dd886d7 docs: fix typo in README
  - id: worktree-list
    type: copy
    text: git worktree list
    note: 저장소 하나에 작업 폴더 둘. 커밋 · 브랜치는 함께 쓰고 파일만 따로다
    skipEngine: true
    output: |-
      /home/kim/devkeys        dd886d7 [main]
      /home/kim/devkeys-hotfix dd886d7 [hotfix/login]
  - id: worktree-remove
    type: copy
    text: git worktree remove ../devkeys-hotfix
    note: (수정을 합친 뒤) 폴더를 지운다. 고친 채 남은 파일이 있으면 거부한다
    skipEngine: true
  - id: branch-delete
    type: copy
    text: git branch -d hotfix/login
    note: 다 쓴 브랜치도 정리
    skipEngine: true
    output: Deleted branch hotfix/login (was dd886d7).
  - id: switch-back
    type: copy
    text: git switch feature/search
    note: 검색 작업으로 돌아왔다
    output: Switched to branch 'feature/search'
  - id: stash-push
    type: copy
    text: 'git stash push -u -m "wip: search ui"'
    note: (화면을 고치던 중 또 불려 간다) -u 는 새 파일까지, -m 은 나중에 알아볼 이름
    skipEngine: true
    output: 'Saved working directory and index state On feature/search: wip: search ui'
  - id: stash-list
    type: copy
    text: git stash list
    skipEngine: true
    output: 'stash@{0}: On feature/search: wip: search ui'
  - id: stash-show
    type: copy
    text: git stash show --stat -u
    note: 치워 둔 것에 무엇이 들었나. -u 를 빼면 새 파일은 보이지 않는다
    skipEngine: true
    output: |2-
       debounce.js | 1 +
       search.html | 2 +-
       2 files changed, 2 insertions(+), 1 deletion(-)
  - id: stash-pop
    type: copy
    text: git stash pop
    note: (돌아와서) 다시 꺼내고 목록에서 지운다. 남겨 두려면 apply
    skipEngine: true
    output: |-
      On branch feature/search
      Changes not staged for commit:
        (use "git add <file>..." to update what will be committed)
        (use "git restore <file>..." to discard changes in working directory)
              modified:   search.html

      Untracked files:
        (use "git add <file>..." to include in what will be committed)
              debounce.js

      no changes added to commit (use "git add" and/or "git commit -a")
      Dropped refs/stash@{0} (8640e3cc5e3081e0745351908d2dcebb4bde0900)

  # ── 도전 모드(뜻 보고 치기)
  - id: recall-branch-v
    type: recall
    prompt: 브랜치 목록을 브랜치마다 마지막 커밋과 함께 본다
    answers: [git branch -v, git branch --verbose]
  - id: recall-only-in
    type: recall
    prompt: <b> 에만 있고 <a> 에는 없는 커밋을 한 줄씩 본다
    answers: [git log --oneline <a>..<b>, git log <a>..<b> --oneline, git log --oneline ^<a> <b>]
    placeholder: { a: main, b: feature/search }
  - id: recall-three-dot
    type: recall
    prompt: <b> 가 <a> 에서 갈라진 뒤 바뀐 파일과 줄 수만 본다
    answers: [git diff <a>...<b> --stat, git diff --stat <a>...<b>]
    placeholder: { a: main, b: feature/search }
    note: 점 세 개는 갈라진 지점(공통 조상)부터, 점 두 개는 두 끝을 그대로 비교한다
  - id: recall-no-merged
    type: recall
    prompt: 지금 브랜치에 아직 합쳐지지 않은 브랜치 목록을 본다
    answers: [git branch --no-merged]
  - id: recall-cherry-pick
    type: recall
    prompt: <branch> 브랜치가 가리키는 커밋 하나를 지금 브랜치로 복사해 온다
    answers: [git cherry-pick <branch>]
    placeholder: { branch: main }
    context: { setup: [git switch -c side, git switch main, git commit, git switch side] }
  - id: recall-cherry-pick-x
    type: recall
    prompt: 커밋 <hash> 를 복사해 오면서 메시지에 원본 해시를 남긴다
    answers: [git cherry-pick -x <hash>]
    placeholder: { hash: 9f2fe31 }
    note: (cherry picked from commit …) 줄이 붙는다 — 백포트할 때 출처를 남기는 관례
  - id: recall-worktree-add
    type: recall
    prompt: 옆 폴더 <dir> 에 새 브랜치 <branch> 를 만들어 작업 폴더를 하나 더 연다
    answers: [git worktree add <dir> -b <branch>, git worktree add -b <branch> <dir>]
    placeholder: { dir: ../devkeys-hotfix, branch: hotfix/login }
  - id: recall-worktree-list
    type: recall
    prompt: 이 저장소에 열린 작업 폴더 목록을 본다
    answers: [git worktree list]
  - id: recall-worktree-remove
    type: recall
    prompt: 다 쓴 작업 폴더 <dir> 를 지운다
    answers: [git worktree remove <dir>]
    placeholder: { dir: ../devkeys-hotfix }
  - id: recall-stash-u
    type: recall
    prompt: 새 파일까지 포함해 하던 일을 치워 둔다 — 이름은 <msg>
    answers:
      - git stash push -u -m "<msg>"
      - git stash push -m "<msg>" -u
      - git stash -u -m "<msg>"
      - git stash push --include-untracked -m "<msg>"
    placeholder: { msg: 'wip: search ui' }
  - id: recall-stash-apply
    type: recall
    prompt: 가장 최근에 치워 둔 것을 꺼내되 목록에는 남겨 둔다
    answers: [git stash apply, 'git stash apply stash@{0}']
  - id: recall-stash-drop
    type: recall
    prompt: 가장 최근에 치워 둔 것을 꺼내지 않고 목록에서 지운다
    answers: [git stash drop, 'git stash drop stash@{0}']
