id: git-branch-merge
category: git
order: 2
title: 브랜치 만들고 합치기
description: branch · switch · merge · stash 로 브랜치를 나누고 합치고 정리하는 명령
level: 1
# 이야기: main(3f2a9c1)에서 로그인·회원가입 기능 브랜치를 만들어 합치고 정리한다.
# 출력은 git 2.4x 기준. 해시는 이야기 안에서 서로 맞게 정했다.
# rebase · cherry-pick 은 트리 미션(/git/tree)에서 다룬다.
# engine: 명령을 Git 엔진으로 차례로 돌려 tree 가 있는 줄에 커밋 트리 그림을 만든다.
#   before 는 치지 않고 엔진에서만 실행하는 명령(이야기 속 "커밋한 뒤"), stash · log 처럼 트리와 상관없는 줄은 skipEngine.
engine:
  root: '3f2a9c1 docs: add README'
items:
  - id: branch-list
    type: copy
    text: git branch
    note: 브랜치 목록. 지금 있는 브랜치 앞에 * 가 붙는다
    output: '* main'
  - id: branch-create
    type: copy
    text: git branch feature/login
    note: 브랜치를 만든다. 브랜치는 커밋 하나를 가리키는 이름표라 아주 가볍다. 이동은 하지 않는다
    tree:
      caption: main 과 같은 커밋에 feature/login 이름표가 하나 더 붙었다. HEAD 는 그대로
  - id: switch
    type: copy
    text: git switch feature/login
    note: 그 브랜치로 이동한다
    tree:
      caption: HEAD 가 feature/login 으로 옮겨 갔다. 커밋은 그대로
    output: Switched to branch 'feature/login'
  - id: switch-main
    type: copy
    text: git switch main
    note: (login.html 을 만들어 커밋한 뒤 — a1b2c3d) main 으로 돌아간다
    tree:
      caption: a1b2c3d 는 feature/login 에만 있다. HEAD 는 main 으로 돌아왔다
    before: ['git commit -m "a1b2c3d feat: add login page"']
    output: Switched to branch 'main'
  - id: merge-ff
    type: copy
    text: git merge feature/login
    note: main 에 합친다. main 이 갈라진 적 없이 뒤처져 있을 뿐이라 포인터만 앞으로 — fast-forward
    tree:
      caption: main 이름표가 a1b2c3d 로 앞으로 — 새 커밋 없이 fast-forward
    output: |-
      Updating 3f2a9c1..a1b2c3d
      Fast-forward
       login.html | 12 ++++++++++++
       1 file changed, 12 insertions(+)
       create mode 100644 login.html
  - id: switch-create
    type: copy
    text: git switch -c feature/signup
    note: 브랜치를 만들면서 바로 이동한다
    tree:
      caption: feature/signup 을 만들고 HEAD 가 바로 옮겨 갔다
    output: Switched to a new branch 'feature/signup'
  - id: switch-back
    type: copy
    text: git switch -
    note: (signup.html 을 만들어 커밋한 뒤 — c7d8e9f) 바로 전에 있던 브랜치(main)로 돌아간다
    tree:
      caption: c7d8e9f 는 feature/signup 에만 있다. HEAD 는 main 으로
    before: ['git commit -m "c7d8e9f feat: add signup page"']
    output: Switched to branch 'main'
  - id: merge-no-ff
    type: copy
    text: git merge --no-ff feature/signup
    note: fast-forward 가 되더라도 머지 커밋을 만든다. 편집기가 열리면 기본 메시지를 저장하고 닫는다
    tree:
      caption: 부모가 둘인 머지 커밋 — 갈라졌다 합쳐진 흔적이 남는다
    hash: e4f5a6b
    output: |-
      Merge made by the 'ort' strategy.
       signup.html | 15 +++++++++++++++
       1 file changed, 15 insertions(+)
       create mode 100644 signup.html
  - id: log-graph
    type: copy
    text: git log --oneline --graph
    note: 합쳐진 모양을 그래프로. login 은 한 줄로 이어지고, signup 은 갈라졌다 합쳐진 흔적이 남았다
    skipEngine: true
    output: |-
      *   e4f5a6b (HEAD -> main) Merge branch 'feature/signup'
      |\
      | * c7d8e9f (feature/signup) feat: add signup page
      |/
      * a1b2c3d (feature/login) feat: add login page
      * 3f2a9c1 docs: add README
  - id: branch-merged
    type: copy
    text: git branch --merged
    note: 지금 브랜치(main)에 이미 합쳐진 브랜치 — 지워도 되는 후보
    skipEngine: true
    output: "  feature/login\n  feature/signup\n* main"
  - id: branch-delete
    type: copy
    text: git branch -d feature/login
    note: 합쳐진 브랜치를 지운다. 합쳐지지 않은 브랜치는 거부해서 커밋을 잃지 않게 막아 준다
    tree:
      caption: feature/login 이름표만 사라진다. 커밋은 main 에 남아 있다
    output: Deleted branch feature/login (was a1b2c3d).
  - id: branch-rename
    type: copy
    text: git branch -m feature/signup feature/join
    note: 브랜치 이름을 바꾼다
  - id: checkout-b
    type: copy
    text: git checkout -b hotfix/typo
    note: 옛 방식으로 switch -c 와 같다. checkout 이 하던 일은 switch(이동)와 restore(복원)로 나뉘었다
    tree:
      caption: hotfix/typo 를 만들고 HEAD 가 옮겨 갔다 — switch -c 와 같다
    output: Switched to a new branch 'hotfix/typo'
  - id: switch-main-again
    type: copy
    text: git switch main
    note: main 으로 돌아간다
    output: Switched to branch 'main'
  - id: branch-force-delete
    type: copy
    text: git branch -D hotfix/typo
    note: 합쳐졌는지 따지지 않고 지운다. 그 브랜치에만 있던 커밋이 있었다면 찾기 어려워진다
    tree:
      caption: hotfix/typo 이름표가 사라졌다. 이 브랜치에만 있던 커밋이 없어 잃은 것도 없다
    output: Deleted branch hotfix/typo (was e4f5a6b).
  - id: branch-list-after
    type: copy
    text: git branch
    note: 남은 브랜치
    output: "  feature/join\n* main"
  - id: stash
    type: copy
    text: git stash
    note: (README.md 를 고치던 중 급한 일이 생기면) 커밋하지 않은 변경을 잠시 치워 둔다
    skipEngine: true
    output: "Saved working directory and index state WIP on main: e4f5a6b Merge branch 'feature/signup'"
  - id: stash-list
    type: copy
    text: git stash list
    note: 치워 둔 목록. stash@{0} 이 가장 최근 것
    skipEngine: true
    output: "stash@{0}: WIP on main: e4f5a6b Merge branch 'feature/signup'"
  - id: stash-pop
    type: copy
    text: git stash pop
    note: (급한 일을 마친 뒤) 가장 최근에 치워 둔 변경을 다시 꺼내고 목록에서 지운다
    skipEngine: true
    output: |-
      On branch main
      Changes not staged for commit:
        (use "git add <file>..." to update what will be committed)
        (use "git restore <file>..." to discard changes in working directory)
              modified:   README.md

      no changes added to commit (use "git add" and/or "git commit -a")
      Dropped refs/stash@{0} (4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b)

  # ── 도전 모드(뜻 보고 치기): 위에서 따라 친 명령을 설명만 보고 떠올려 친다.
  #    context 가 있는 문제는 정답 목록에 없는 동의어도 엔진으로 실행해 결과가 같으면 정답이다.
  #    결과가 같아도 뜻이 다른 명령(branch -D 와 -d, 이름을 쓴 switch 와 switch -)은 context 를 두지 않는다.
  - id: recall-branch-create
    type: recall
    prompt: <name> 브랜치를 만든다 — 이동은 하지 않는다
    answers: [git branch <name>]
    placeholder: { name: feature/login }
    context: { setup: [] }
  - id: recall-switch
    type: recall
    prompt: <name> 브랜치로 이동한다
    answers: [git switch <name>, git checkout <name>]
    placeholder: { name: feature/login }
    context: { setup: [git branch feature/login] }
  - id: recall-switch-create
    type: recall
    prompt: <name> 브랜치를 만들면서 바로 이동한다
    answers: [git switch -c <name>, git checkout -b <name>]
    placeholder: { name: feature/signup }
    context: { setup: [] }
  - id: recall-switch-back
    type: recall
    prompt: 바로 전에 있던 브랜치로 돌아간다
    answers: [git switch -, git checkout -]
  - id: recall-merge
    type: recall
    prompt: 지금 브랜치(main)에 <name> 브랜치를 합친다 — 갈라진 적이 없으면 fast-forward 로
    answers: [git merge <name>]
    placeholder: { name: feature/login }
    context: { setup: [git switch -c feature/login, git commit, git switch main] }
  - id: recall-merge-no-ff
    type: recall
    prompt: fast-forward 가 되더라도 머지 커밋을 만들어 <name> 브랜치를 합친다
    answers: [git merge --no-ff <name>]
    placeholder: { name: feature/signup }
    context: { setup: [git switch -c feature/signup, git commit, git switch main] }
    note: 브랜치에서 한 작업이 기록에 한 덩어리로 남는다
  - id: recall-branch-merged
    type: recall
    prompt: 지금 브랜치에 이미 합쳐진 브랜치 목록을 본다
    answers: [git branch --merged]
  - id: recall-branch-delete
    type: recall
    prompt: 합쳐진 <name> 브랜치를 지운다 — 합쳐지지 않았으면 거부하게
    answers: [git branch -d <name>, git branch --delete <name>]
    placeholder: { name: feature/login }
  - id: recall-branch-force-delete
    type: recall
    prompt: 합쳐졌는지 따지지 않고 <name> 브랜치를 지운다
    answers: [git branch -D <name>, git branch --delete --force <name>]
    placeholder: { name: hotfix/typo }
    note: 그 브랜치에만 있던 커밋은 이름표가 없어져 찾기 어려워진다
  - id: recall-branch-rename
    type: recall
    prompt: <old> 브랜치의 이름을 바꾼다 — 새 이름은 <new>
    answers: [git branch -m <old> <new>, git branch --move <old> <new>]
    placeholder: { old: feature/signup, new: feature/join }
  - id: recall-log-graph
    type: recall
    prompt: 커밋 기록을 한 줄씩, 갈라지고 합쳐진 모양까지 그래프로 본다
    answers: [git log --oneline --graph, git log --graph --oneline]
  - id: recall-stash
    type: recall
    prompt: 커밋하지 않은 변경을 잠시 치워 둔다
    answers: [git stash, git stash push]
  - id: recall-stash-list
    type: recall
    prompt: 치워 둔 변경 목록을 본다
    answers: [git stash list]
  - id: recall-stash-pop
    type: recall
    prompt: 가장 최근에 치워 둔 변경을 다시 꺼내고 목록에서 지운다
    answers: [git stash pop]
    note: apply 는 꺼내기만 하고 목록에 남긴다
