id: git-basic-commit
category: git
order: 1
title: 변경 사항 기록하기
description: init · status · add · diff · commit · log · restore · reset 으로 저장소를 만들고 변경을 기록하고 되돌리기
level: 1
# 이야기: ~/devkeys 폴더에 저장소를 만들고 README.md 를 커밋한 뒤, 고치고 되돌려 본다.
# 출력은 git 2.4x 기준. 해시는 이야기 안에서 서로 맞게 정했다.
items:
  - id: config-name
    type: copy
    text: 'git config --global user.name "Kim Dev"'
    note: 커밋에 남을 이름. --global 은 이 PC 의 모든 저장소에 적용된다 (출력 없음)
  - id: config-email
    type: copy
    text: 'git config --global user.email "dev@example.com"'
    note: 커밋에 남을 이메일
  - id: config-branch
    type: copy
    text: git config --global init.defaultBranch main
    note: 새 저장소의 첫 브랜치 이름을 main 으로
  - id: init
    type: copy
    text: git init
    note: 지금 폴더(~/devkeys)를 Git 저장소로 만든다
    output: Initialized empty Git repository in /home/kim/devkeys/.git/
    scene:
      caption: .git 이 생겼다 — 작업 트리 · 스테이징 · 저장소 세 칸이 준비됐다
  - id: status-untracked
    type: copy
    text: git status
    note: (README.md 를 만든 뒤) 상태를 본다 — 아직 Git 이 추적하지 않는 파일이 있다
    output: |-
      On branch main

      No commits yet

      Untracked files:
        (use "git add <file>..." to include in what will be committed)
              README.md

      nothing added to commit but untracked files present (use "git add" to track)
    scene:
      workdir: [README.md (새 파일)]
      caption: README.md 는 작업 트리에만 있다 — Git 이 아직 추적하지 않는다
  - id: add-file
    type: copy
    text: git add README.md
    note: README.md 를 스테이징한다 — 다음 커밋에 넣을 목록에 올린다
    scene:
      staged: [README.md (새 파일)]
      arrow: { from: workdir, to: staged, label: add }
      caption: 스테이징에 올렸다 — 다음 커밋에 들어갈 목록
  - id: status-short
    type: copy
    text: git status --short
    note: 짧게 보기. 왼쪽 칸이 스테이징 상태다 — A 는 새로 추가됨
    output: A  README.md
  - id: commit-first
    type: copy
    text: 'git commit -m "docs: add README"'
    note: 스테이징된 변경을 메시지와 함께 커밋한다. 첫 커밋이라 root-commit
    output: |-
      [main (root-commit) 3f2a9c1] docs: add README
       1 file changed, 1 insertion(+)
       create mode 100644 README.md
    scene:
      repo: ['3f2a9c1 docs: add README']
      arrow: { from: staged, to: repo, label: commit }
      caption: 스테이징된 것이 커밋으로 기록됐다. 스테이징은 다시 비었다
  - id: diff
    type: copy
    text: git diff
    note: (README.md 에 한 줄을 더한 뒤) 아직 스테이징하지 않은 변경을 본다 — + 가 더한 줄
    output: |-
      diff --git a/README.md b/README.md
      index 1b3c5d7..9e8f7a6 100644
      --- a/README.md
      +++ b/README.md
      @@ -1 +1,2 @@
       # DevKeys
      +Typing practice for developers
    scene:
      workdir: [README.md (고침)]
      repo: ['3f2a9c1 docs: add README']
      compare: [workdir, staged]
      caption: 작업 트리를 스테이징(마지막으로 add 한 상태)과 비교 — 아직 add 안 한 변경
  - id: add-all
    type: copy
    text: git add .
    note: 지금 폴더 아래의 변경을 모두 스테이징한다
    scene:
      staged: [README.md (고침)]
      repo: ['3f2a9c1 docs: add README']
      arrow: { from: workdir, to: staged, label: add }
      caption: 고친 README.md 가 스테이징에 올라갔다
  - id: diff-staged
    type: copy
    text: git diff --staged
    note: 스테이징된 변경, 즉 커밋될 내용을 본다. 이제 git diff 만 치면 아무것도 안 나온다
    output: |-
      diff --git a/README.md b/README.md
      index 1b3c5d7..9e8f7a6 100644
      --- a/README.md
      +++ b/README.md
      @@ -1 +1,2 @@
       # DevKeys
      +Typing practice for developers
    scene:
      staged: [README.md (고침)]
      repo: ['3f2a9c1 docs: add README']
      compare: [staged, repo]
      caption: 스테이징을 마지막 커밋과 비교 — 커밋하면 들어갈 변경
  - id: restore-staged
    type: copy
    text: git restore --staged README.md
    note: 스테이징만 취소한다. 파일을 고친 내용은 그대로 남는다
    scene:
      workdir: [README.md (고침)]
      repo: ['3f2a9c1 docs: add README']
      arrow: { from: repo, to: staged, label: restore --staged }
      caption: 스테이징을 마지막 커밋 상태로 되돌렸다 — 고친 내용은 작업 트리에 남는다
  - id: status-modified
    type: copy
    text: git status --short
    note: 오른쪽 칸의 M — 고쳤지만 스테이징하지 않음
    output: ' M README.md'
  - id: add-again
    type: copy
    text: git add README.md
    note: 다시 스테이징
  - id: commit-second
    type: copy
    text: 'git commit -m "docs: describe project"'
    note: 두 번째 커밋
    output: |-
      [main 7d4e8b2] docs: describe project
       1 file changed, 1 insertion(+)
    scene:
      repo: ['7d4e8b2 docs: describe project', '3f2a9c1 docs: add README']
      arrow: { from: staged, to: repo, label: commit }
      caption: 두 번째 커밋 — 최신 커밋이 위에 쌓이고 HEAD 가 따라 올라간다
  - id: log
    type: copy
    text: git log --oneline
    note: 커밋 기록을 한 줄씩. HEAD -> main 은 지금 main 브랜치의 끝에 있다는 뜻
    output: |-
      7d4e8b2 (HEAD -> main) docs: describe project
      3f2a9c1 docs: add README
  - id: show
    type: copy
    text: git show --stat HEAD
    note: 마지막 커밋의 정보와 바뀐 파일 목록을 본다 (--stat 을 빼면 변경 내용 전체)
    output: |-
      commit 7d4e8b2c5a1f9e3d6b8a0c2e4f6a8b0c1d3e5f7a (HEAD -> main)
      Author: Kim Dev <dev@example.com>
      Date:   Fri Oct 16 21:05:12 2026 +0900

          docs: describe project

       README.md | 1 +
       1 file changed, 1 insertion(+)
  - id: amend
    type: copy
    text: 'git commit --amend -m "docs: describe the project"'
    note: 마지막 커밋의 메시지를 고친다. 커밋이 새로 만들어진다 — 이미 push 한 커밋에는 쓰지 않는다
    output: |-
      [main 9b1c3d5] docs: describe the project
       Date: Fri Oct 16 21:05:12 2026 +0900
       1 file changed, 1 insertion(+)
    scene:
      repo: ['9b1c3d5 docs: describe the project', '~7d4e8b2 docs: describe project', '3f2a9c1 docs: add README']
      caption: 마지막 커밋을 새 커밋으로 바꿔 끼웠다 — 해시가 7d4e8b2 에서 9b1c3d5 로
  - id: log-after-amend
    type: copy
    text: git log --oneline
    note: 7d4e8b2 가 9b1c3d5 로 바뀌었다 — amend 는 고치는 게 아니라 바꿔 끼우는 것
    output: |-
      9b1c3d5 (HEAD -> main) docs: describe the project
      3f2a9c1 docs: add README
  - id: restore
    type: copy
    text: git restore README.md
    note: (README.md 를 실수로 망친 뒤) 스테이징하지 않은 변경을 버린다 — 되돌릴 수 없다
    scene:
      workdir: ['~README.md (망친 변경)']
      repo: ['9b1c3d5 docs: describe the project', '3f2a9c1 docs: add README']
      arrow: { from: staged, to: workdir, label: restore }
      caption: 작업 트리를 스테이징 상태로 덮어썼다 — 망친 변경은 사라졌고 되돌릴 수 없다
  - id: reset-soft
    type: copy
    text: git reset --soft HEAD~1
    note: 마지막 커밋을 취소한다. HEAD~1 은 바로 앞 커밋. --soft 라 변경은 스테이징된 채로 남는다
    scene:
      staged: [README.md (고침)]
      repo: ['~9b1c3d5 docs: describe the project', '3f2a9c1 docs: add README']
      arrow: { from: repo, to: staged, label: reset --soft }
      caption: HEAD 가 한 칸 뒤로 — 취소한 커밋의 변경은 스테이징에 남았다
  - id: status-staged
    type: copy
    text: git status --short
    note: 왼쪽 칸의 M — 고친 것이 스테이징돼 있다. 다시 커밋하면 된다
    output: M  README.md

  # ── 도전 모드(뜻 보고 치기): 위에서 따라 친 명령을 설명만 보고 떠올려 친다.
  #    context 가 있는 문제는 정답 목록에 없는 동의어도 엔진으로 실행해 결과가 같으면 정답이다.
  - id: recall-init
    type: recall
    prompt: 지금 폴더를 Git 저장소로 만든다
    answers: [git init]
  - id: recall-config-name
    type: recall
    prompt: 이 PC 의 모든 저장소에서 커밋에 남을 이름을 정한다 — 이름은 <name>
    answers: ['git config --global user.name "<name>"']
    placeholder: { name: Kim Dev }
    note: 값에 공백이 있으면 따옴표로 감싼다. --global 을 빼면 이 저장소에만 적용된다
  - id: recall-status
    type: recall
    prompt: 어떤 파일이 바뀌었고 무엇이 스테이징됐는지 상태를 본다
    answers: [git status]
  - id: recall-add-file
    type: recall
    prompt: <file> 파일을 스테이징한다 — 다음 커밋에 넣을 목록에 올린다
    answers: [git add <file>, git stage <file>]
    placeholder: { file: README.md }
  - id: recall-add-all
    type: recall
    prompt: 저장소 맨 위 폴더에서, 바뀐 파일을 모두 스테이징한다
    answers: [git add ., git add -A, git add --all]
    note: git add . 은 지금 폴더 아래만, -A 는 저장소 전체. 맨 위 폴더에서는 같다
  - id: recall-commit
    type: recall
    prompt: 스테이징한 변경을 <msg> 메시지로 커밋한다
    answers: ['git commit -m "<msg>"']
    placeholder: { msg: 'docs: add README' }
    context: { setup: [] }
  - id: recall-diff
    type: recall
    prompt: 아직 스테이징하지 않은 변경 내용을 본다
    answers: [git diff]
  - id: recall-diff-staged
    type: recall
    prompt: 스테이징된 변경, 즉 다음 커밋에 들어갈 내용을 본다
    answers: [git diff --staged, git diff --cached]
  - id: recall-restore-staged
    type: recall
    prompt: <file> 의 스테이징만 취소한다 — 고친 내용은 그대로 둔다
    answers:
      - git restore --staged <file>
      - git reset <file>
      - git reset HEAD <file>
      - git reset -- <file>
      - git reset HEAD -- <file>
    placeholder: { file: README.md }
    note: 예전에는 git reset <파일> 을 썼다. restore 는 이 일을 따로 떼어 낸 새 명령
  - id: recall-log
    type: recall
    prompt: 커밋 기록을 한 줄씩 짧게 본다
    answers: [git log --oneline]
  - id: recall-amend
    type: recall
    prompt: 마지막 커밋의 메시지를 고친다 — 새 메시지는 <msg>
    answers: ['git commit --amend -m "<msg>"', 'git commit -m "<msg>" --amend']
    placeholder: { msg: 'docs: describe the project' }
    note: 커밋을 새로 만들어 바꿔 끼운다 — 이미 push 한 커밋에는 쓰지 않는다
  - id: recall-restore
    type: recall
    prompt: <file> 의 스테이징하지 않은 변경을 버린다 (되돌릴 수 없다)
    answers: [git restore <file>, git checkout -- <file>]
    placeholder: { file: README.md }
  - id: recall-reset-soft
    type: recall
    prompt: 마지막 커밋을 취소하되, 변경은 스테이징된 채로 남긴다
    answers: [git reset --soft HEAD~1, git reset --soft HEAD^]
    context: { setup: [git commit, git commit] }
    note: --hard 는 변경까지 버리고, 옵션 없이(--mixed) 치면 스테이징도 취소된다
