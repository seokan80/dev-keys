id: git-basic-commit
category: git
order: 1
title: 변경 사항 기록하기
description: init · add · commit · log · restore 로 변경을 기록하고 되돌리는 기본 명령
level: 1
items:
  - id: init
    type: copy
    text: git init
    note: 지금 폴더를 Git 저장소로 만든다 (.git 폴더가 생긴다)
  - id: config-name
    type: copy
    text: 'git config --global user.name "Kim Dev"'
    note: 커밋에 남을 이름. --global 은 이 PC 의 모든 저장소에 적용된다
  - id: config-email
    type: copy
    text: 'git config --global user.email "dev@example.com"'
    note: 커밋에 남을 이메일
  - id: status
    type: copy
    text: git status
    note: 바뀐 파일과 스테이징된 파일을 본다
  - id: add-file
    type: copy
    text: git add README.md
    note: 파일 하나를 스테이징한다 — 다음 커밋에 넣을 목록에 올린다
  - id: add-all
    type: copy
    text: git add .
    note: 지금 폴더 아래의 변경을 모두 스테이징한다
  - id: diff
    type: copy
    text: git diff
    note: 아직 스테이징하지 않은 변경을 본다
  - id: diff-staged
    type: copy
    text: git diff --staged
    note: 스테이징된 변경, 즉 커밋될 내용을 본다
  - id: commit
    type: copy
    text: 'git commit -m "docs: add README"'
    note: 스테이징된 변경을 메시지와 함께 커밋한다
  - id: log
    type: copy
    text: git log --oneline
    note: 커밋 기록을 한 줄씩 본다
  - id: log-graph
    type: copy
    text: git log --oneline --graph --all
    note: 모든 브랜치의 커밋을 그래프로 본다
  - id: show
    type: copy
    text: git show HEAD
    note: 마지막 커밋의 정보와 변경 내용을 본다
  - id: restore
    type: copy
    text: git restore README.md
    note: 스테이징하지 않은 변경을 버린다 — 되돌릴 수 없으니 주의
  - id: restore-staged
    type: copy
    text: git restore --staged README.md
    note: 스테이징만 취소한다. 파일의 변경은 그대로 남는다
  - id: amend
    type: copy
    text: 'git commit --amend -m "docs: add README and LICENSE"'
    note: 마지막 커밋을 고쳐 새로 만든다. 이미 push 한 커밋에는 쓰지 않는다
  - id: reset-soft
    type: copy
    text: git reset --soft HEAD~1
    note: 마지막 커밋을 취소하고, 그 변경은 스테이징된 채로 남긴다
  - id: rm-cached
    type: copy
    text: git rm --cached .env
    note: Git 추적만 멈추고 파일은 남긴다. .gitignore 에도 함께 추가한다
