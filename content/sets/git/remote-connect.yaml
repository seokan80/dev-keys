id: git-remote-connect
category: git
order: 7
title: 원격 저장소 연결
description: remote · push -u · clone 으로 내 저장소를 GitHub 에 처음 올리고, 브랜치를 올리고, 다른 곳에서 받기
level: 2
# 이야기: ~/devkeys 에서 만든 저장소를 GitHub 의 빈 저장소(kim/devkeys)에 처음 올리고, 기능 브랜치를 올리고, 노트북에 받는다.
# 출력은 실제로 실행해 뽑았다 — git 2.53 으로 연습용 GitHub 저장소에: scripts/git-story.sh content/stories/git/remote-connect.sh
#   clone 만은 같은 브랜치를 올린 연습용 서버 저장소에서 받았다. GitHub 에서 받으면 remote: 줄의 숫자가 실행마다 달라서다.
# 원격은 커밋 그래프 엔진 범위 밖이라 따라치기와 출력만 둔다.
items:
  - id: remote-add
    type: copy
    text: git remote add origin https://github.com/kim/devkeys.git
    note: (GitHub 에서 빈 저장소 kim/devkeys 를 만든 뒤) 그 주소를 origin 이라는 이름으로 등록한다. origin 은 관례로 쓰는 이름
  - id: remote-v
    type: copy
    text: git remote -v
    note: 등록된 원격과 주소. 받을 때(fetch)와 올릴 때(push) 주소를 따로 둘 수 있어서 두 줄이다
    output: |-
      origin  https://github.com/kim/devkeys.git (fetch)
      origin  https://github.com/kim/devkeys.git (push)
  - id: push-u
    type: copy
    text: git push -u origin main
    note: main 을 처음 올린다. -u 는 origin/main 을 main 의 짝(upstream)으로 정해서, 다음부터는 git push · git pull 만 쳐도 된다
    output: |-
      Enumerating objects: 6, done.
      Counting objects: 100% (6/6), done.
      Delta compression using up to 8 threads
      Compressing objects: 100% (3/3), done.
      Writing objects: 100% (6/6), 497 bytes | 1.00 MiB/s, done.
      Total 6 (delta 0), reused 0 (delta 0), pack-reused 0 (from 0)
      To https://github.com/kim/devkeys.git
       * [new branch]      main -> main
      branch 'main' set up to track 'origin/main'.
  - id: branch-vv
    type: copy
    text: git branch -vv
    note: 브랜치마다 짝인 원격 브랜치를 [ ] 안에 보여 준다
    output: '* main b38bb74 [origin/main] feat: add login page'
  - id: status
    type: copy
    text: git status
    note: 짝이 생기면 짝과 비교한 줄이 하나 더 나온다. 이 비교는 마지막으로 받아 온(fetch) 때 기준이다
    output: |-
      On branch main
      Your branch is up to date with 'origin/main'.

      nothing to commit, working tree clean
  - id: switch-search
    type: copy
    text: git switch -c feature/search
    note: 검색 기능 브랜치를 만든다
    output: Switched to a new branch 'feature/search'
  - id: push-no-upstream
    type: copy
    text: git push
    note: (검색창을 커밋한 뒤) 짝이 없는 새 브랜치는 git push 만으로는 올라가지 않는다. 어떻게 올릴지 알려 준다
    output: |-
      fatal: The current branch feature/search has no upstream branch.
      To push the current branch and set the remote as upstream, use

          git push --set-upstream origin feature/search

      To have this happen automatically for branches without a tracking
      upstream, see 'push.autoSetupRemote' in 'git help config'.
  - id: push-u-branch
    type: copy
    text: git push -u origin feature/search
    note: 원격과 브랜치 이름을 적어 올리면서 짝을 정한다. GitHub 가 PR 을 만들 주소를 알려 준다
    output: |-
      Enumerating objects: 4, done.
      Counting objects: 100% (4/4), done.
      Delta compression using up to 8 threads
      Compressing objects: 100% (2/2), done.
      Writing objects: 100% (3/3), 325 bytes | 1.00 MiB/s, done.
      Total 3 (delta 0), reused 0 (delta 0), pack-reused 0 (from 0)
      remote:
      remote: Create a pull request for 'feature/search' on GitHub by visiting:
      remote:      https://github.com/kim/devkeys/pull/new/feature/search
      remote:
      To https://github.com/kim/devkeys.git
       * [new branch]      feature/search -> feature/search
      branch 'feature/search' set up to track 'origin/feature/search'.
  - id: auto-setup-remote
    type: copy
    text: git config --global push.autoSetupRemote true
    note: (2.37) 짝이 없으면 같은 이름으로 짝을 만들며 올린다. 새 브랜치마다 -u 를 칠 필요가 없다
  - id: switch-signup
    type: copy
    text: git switch -c feature/signup
    note: 회원가입 브랜치
    output: Switched to a new branch 'feature/signup'
  - id: push-auto
    type: copy
    text: git push
    note: (회원가입 화면을 커밋한 뒤) 이제 git push 만으로 올라가고 짝도 정해진다
    output: |-
      Enumerating objects: 4, done.
      Counting objects: 100% (4/4), done.
      Delta compression using up to 8 threads
      Compressing objects: 100% (2/2), done.
      Writing objects: 100% (3/3), 297 bytes | 1.00 MiB/s, done.
      Total 3 (delta 1), reused 0 (delta 0), pack-reused 0 (from 0)
      remote: Resolving deltas: 100% (1/1), completed with 1 local object.
      remote:
      remote: Create a pull request for 'feature/signup' on GitHub by visiting:
      remote:      https://github.com/kim/devkeys/pull/new/feature/signup
      remote:
      To https://github.com/kim/devkeys.git
       * [new branch]      feature/signup -> feature/signup
      branch 'feature/signup' set up to track 'origin/feature/signup'.
  - id: branch-vv-after
    type: copy
    text: git branch -vv
    note: 세 브랜치 모두 짝이 생겼다
    output: |2-
        feature/search 46fe865 [origin/feature/search] feat: add search box
      * feature/signup 53621ba [origin/feature/signup] feat: add signup page
        main           b38bb74 [origin/main] feat: add login page
  - id: clone
    type: copy
    text: git clone https://github.com/kim/devkeys.git ~/laptop/devkeys
    note: (노트북에서) 저장소를 통째로 받는다. 받은 주소는 origin 으로 등록되고, 기본 브랜치(main)를 꺼내 둔다. 폴더를 적지 않으면 저장소 이름(devkeys)으로 만든다
    output: |-
      Cloning into '/home/kim/laptop/devkeys'...
      remote: Enumerating objects: 12, done.
      remote: Counting objects: 100% (12/12), done.
      remote: Compressing objects: 100% (7/7), done.
      remote: Total 12 (delta 2), reused 0 (delta 0), pack-reused 0 (from 0)
      Receiving objects: 100% (12/12), done.
      Resolving deltas: 100% (2/2), done.
  - id: cd
    type: copy
    text: cd ~/laptop/devkeys
  - id: branch-a
    type: copy
    text: git branch -a
    note: 원격 브랜치(remotes/origin/…)까지 본다. 로컬 브랜치는 아직 main 하나 — 다른 브랜치는 switch 하면 그때 만들어진다
    output: |-
      * main
        remotes/origin/HEAD -> origin/main
        remotes/origin/feature/search
        remotes/origin/feature/signup
        remotes/origin/main
  - id: set-url
    type: copy
    text: git remote set-url origin git@github.com:kim/devkeys.git
    note: 등록된 주소를 바꾼다 — HTTPS 를 SSH 로 (GitHub 에 SSH 키를 등록해 둔 경우). 저장소 이름이 바뀌었을 때도 쓴다
  - id: remote-v-after
    type: copy
    text: git remote -v
    note: 바뀐 주소
    output: |-
      origin  git@github.com:kim/devkeys.git (fetch)
      origin  git@github.com:kim/devkeys.git (push)
  - id: recall-remote-add
    type: recall
    prompt: 원격 저장소를 등록한다 — 이름은 <name>, 주소는 <url>
    answers: [git remote add <name> <url>]
    placeholder: { name: origin, url: 'https://github.com/kim/devkeys.git' }
  - id: recall-remote-v
    type: recall
    prompt: 등록된 원격의 이름과 주소를 본다
    answers: [git remote -v, git remote --verbose]
  - id: recall-push-u
    type: recall
    prompt: 브랜치를 처음 올리면서 짝(upstream)을 정한다 — 원격은 <remote>, 브랜치는 <branch>
    answers: [git push -u <remote> <branch>, git push --set-upstream <remote> <branch>]
    placeholder: { remote: origin, branch: feature/search }
  - id: recall-branch-vv
    type: recall
    prompt: 브랜치마다 짝인 원격 브랜치와 마지막 커밋을 본다
    answers: [git branch -vv]
  - id: recall-auto-setup-remote
    type: recall
    prompt: 짝이 없는 새 브랜치도 git push 만으로 올라가게 전역 설정한다
    answers: [git config --global push.autoSetupRemote true, git config set --global push.autoSetupRemote true]
  - id: recall-clone
    type: recall
    prompt: 저장소를 받는다 — 주소는 <url>
    answers: [git clone <url>]
    placeholder: { url: 'https://github.com/kim/devkeys.git' }
  - id: recall-branch-a
    type: recall
    prompt: 원격 브랜치까지 모든 브랜치를 본다
    answers: [git branch -a, git branch --all]
  - id: recall-set-url
    type: recall
    prompt: origin 의 주소를 바꾼다 — 새 주소는 <url>
    answers: [git remote set-url origin <url>]
    placeholder: { url: 'git@github.com:kim/devkeys.git' }
