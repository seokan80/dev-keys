id: git-agent-team
category: git
order: 26
title: AI 에이전트와 함께하는 팀
description: 팀 규칙(AGENTS.md · CODEOWNERS) 아래에서 에이전트가 브랜치를 올리고 draft PR 을 열면, 사람이 검토해 ready → squash 로 합치기. 같은 계정은 자기 PR 을 승인할 수 없다
level: 3
# 이야기: 팀 규칙이 있는 저장소에서 에이전트가 이슈 42 를 맡아 브랜치를 올리고 draft PR 을 연다.
#   사람이 검토해 ready 로 바꾸고 squash 로 합친다. 같은 계정은 자기 PR 을 승인할 수 없다는 것도 본다.
# 출력은 실제로 실행해 뽑았다 — git 2.53 + gh 를 연습용 GitHub 저장소에서: scripts/git-story.sh content/stories/git/agent-team.sh
#   저장소 이름 · PR 번호(#12) · GitHub 가 만든 커밋 해시(3e7d1c9)는 실행할 때마다 달라서 이야기 속 값으로 바꿨다.
# engine: 커밋 그래프가 옆에 늘 보인다. gh 는 엔진이 몰라서 병합은 as 로 엔진의 명령들로 돌린다.
engine:
  root: '467c6aa docs: add team rules'
items:
  - id: clone
    type: copy
    text: git clone https://github.com/kim/devkeys.git
    note: 팀 저장소를 받는다
    skipEngine: true
    output: |-
      Cloning into 'devkeys'...
      remote: Enumerating objects: 6, done.
      remote: Counting objects: 100% (6/6), done.
      remote: Compressing objects: 100% (3/3), done.
      remote: Total 6 (delta 0), reused 6 (delta 0), pack-reused 0 (from 0)
      Receiving objects: 100% (6/6), done.
  - id: cd
    type: copy
    text: cd devkeys
    skipEngine: true
  - id: agents-md
    type: copy
    text: cat AGENTS.md
    note: 에이전트가 읽는 팀 규칙. 에이전트 도구는 작업을 시작할 때 이 파일을 읽는다
    skipEngine: true
    output: |-
      # Rules for AI agents
      - One task = one branch: agent/<issue>-<name>
      - Open pull requests as draft. A human marks them ready.
      - Conventional Commits, with a Co-authored-by trailer
      - Never push to main
  - id: codeowners
    type: copy
    text: cat .github/CODEOWNERS
    note: 경로마다 검토할 사람. PR 이 그 경로를 바꾸면 GitHub 가 검토를 요청한다 (보호 규칙에서 필수로 할 수 있다)
    skipEngine: true
    output: |-
      *        @kim
      /src/api @kim @lee
  - id: branch
    type: copy
    text: git switch -c agent/42-search
    note: (에이전트가 이슈 42 를 맡았다) 규칙대로 agent/<이슈>-<이름> 브랜치
    output: Switched to a new branch 'agent/42-search'
    tree:
      caption: 에이전트의 작업 브랜치 — main 에는 직접 올리지 않는다
  - id: agent-commit
    type: copy
    text: git log --oneline -1
    note: (에이전트가 커밋했다) 올리기 전에 무엇을 올리는지 본다
    before: ['git commit -m "90c5220 feat(search): add search box"']
    skipEngine: true
    output: '90c5220 (HEAD -> agent/42-search) feat(search): add search box'
  - id: push
    type: copy
    text: git push -u origin agent/42-search
    note: 브랜치를 올린다. GitHub 가 PR 을 만들 주소를 알려 준다
    skipEngine: true
    output: |-
      Enumerating objects: 5, done.
      Counting objects: 100% (5/5), done.
      Delta compression using up to 8 threads
      Compressing objects: 100% (2/2), done.
      Writing objects: 100% (4/4), 368 bytes | 1.00 MiB/s, done.
      Total 4 (delta 1), reused 0 (delta 0), pack-reused 0 (from 0)
      remote: Resolving deltas: 100% (1/1), completed with 1 local object.
      remote:
      remote: Create a pull request for 'agent/42-search' on GitHub by visiting:
      remote:      https://github.com/kim/devkeys/pull/new/agent/42-search
      remote:
      To https://github.com/kim/devkeys.git
       * [new branch]      agent/42-search -> agent/42-search
      branch 'agent/42-search' set up to track 'origin/agent/42-search'.
  - id: pr-draft
    type: copy
    text: gh pr create --draft --fill
    note: 초안(draft) PR — 제목 · 본문은 커밋에서(--fill). 초안은 실수로 합쳐지지 않는다
    skipEngine: true
    output: https://github.com/kim/devkeys/pull/12
  - id: pr-view
    type: copy
    text: gh pr view --json title,isDraft,headRefName
    note: PR 정보를 JSON 으로 — 에이전트 · 스크립트가 읽기 좋다
    skipEngine: true
    output: |-
      {
        "headRefName": "agent/42-search",
        "isDraft": true,
        "title": "feat(search): add search box"
      }
  - id: pr-diff
    type: copy
    text: gh pr diff --name-only
    note: (사람이 검토한다) 바뀐 파일부터. 내용은 --name-only 를 빼면
    skipEngine: true
    output: src/search.html
  - id: pr-ready
    type: copy
    text: gh pr ready
    note: 검토해 보니 괜찮다 — 초안을 풀어 합칠 수 있게
    skipEngine: true
    output: '✓ Pull request kim/devkeys#12 is marked as "ready for review"'
  - id: pr-approve
    type: copy
    text: gh pr review --approve
    note: 승인하려 했더니 — 이 PR 은 같은 계정이 열었다. 자기 PR 은 승인할 수 없다
    skipEngine: true
    output: 'failed to create review: GraphQL: Review Can not approve your own pull request (addPullRequestReview)'
  - id: pr-merge
    type: copy
    text: gh pr merge --squash --delete-branch
    note: (승인 규칙이 없는 저장소라) 합친다. squash — 커밋들을 하나로 묶어 main 에. 브랜치도 지운다
    as: [git switch main, git cherry-pick agent/42-search, git branch -D agent/42-search]
    hash: 3e7d1c9
    output: |-
      ✓ Squashed and merged pull request kim/devkeys#12 (feat(search): add search box)
      remote: Enumerating objects: 5, done.
      remote: Counting objects: 100% (5/5), done.
      remote: Compressing objects: 100% (1/1), done.
      remote: Total 4 (delta 1), reused 3 (delta 1), pack-reused 0 (from 0)
      Unpacking objects: 100% (4/4), 1.03 KiB | 1.00 MiB/s, done.
      From https://github.com/kim/devkeys
       * branch            main       -> FETCH_HEAD
         467c6aa..3e7d1c9  main       -> origin/main
      Updating 467c6aa..3e7d1c9
      Fast-forward
       src/search.html | 1 +
       1 file changed, 1 insertion(+)
       create mode 100644 src/search.html
      ✓ Deleted local branch agent/42-search and switched to branch main
      ✓ Deleted remote branch agent/42-search
    tree:
      caption: squash — 에이전트 브랜치의 커밋이 main 에 새 커밋 하나로. 브랜치는 지워졌다
  - id: log
    type: copy
    text: git log --oneline -2
    note: 제목 끝의 (#12) 로 어느 PR 에서 왔는지 남는다
    skipEngine: true
    output: |-
      3e7d1c9 (HEAD -> main, origin/main, origin/HEAD) feat(search): add search box (#12)
      467c6aa docs: add team rules
  - id: branch-a
    type: copy
    text: git branch -a
    note: GitHub 의 브랜치는 지워졌지만 내 쪽 기록(remotes/origin/agent/42-search)은 남았다 — git fetch --prune (또는 fetch.prune 설정)이 정리한다
    skipEngine: true
    output: |-
      * main
        remotes/origin/HEAD -> origin/main
        remotes/origin/agent/42-search
        remotes/origin/main
  - id: pr-list
    type: copy
    text: gh pr list --state merged --limit 1 --json number,title
    note: 합쳐진 PR — 이슈 · PR · 커밋이 서로 이어져 남는다
    skipEngine: true
    output: |-
      [
        {
          "number": 12,
          "title": "feat(search): add search box"
        }
      ]

  # ── 도전 모드(뜻 보고 치기)
  - id: recall-push-u
    type: recall
    prompt: 새 브랜치를 원격에 올리고 추적하게 한다 — 브랜치는 <branch>
    answers: [git push -u origin <branch>, git push --set-upstream origin <branch>]
    placeholder: { branch: agent/42-search }
  - id: recall-draft
    type: recall
    prompt: 지금 브랜치로 초안(draft) PR 을 만든다 — 제목 · 본문은 커밋에서
    answers: [gh pr create --draft --fill, gh pr create --fill --draft, gh pr create -d -f]
  - id: recall-diff
    type: recall
    prompt: PR 에서 바뀐 파일 이름만 본다
    answers: [gh pr diff --name-only]
  - id: recall-ready
    type: recall
    prompt: 초안 PR 을 합칠 수 있는 상태(ready)로 바꾼다
    answers: [gh pr ready]
  - id: recall-approve
    type: recall
    prompt: PR 을 승인한다
    answers: [gh pr review --approve, gh pr review -a]
  - id: recall-merge
    type: recall
    prompt: PR 의 커밋들을 하나로 묶어(squash) 합치고 브랜치도 지운다
    answers: [gh pr merge --squash --delete-branch, gh pr merge --delete-branch --squash, gh pr merge -s -d]
